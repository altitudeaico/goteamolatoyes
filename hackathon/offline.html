<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | CODE QUEST</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #0f0e1a, #1e1b4b, #2d1b69);
      min-height: 100vh; color: white;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 40px 20px;
    }
    .icon { font-size: 80px; margin-bottom: 24px; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(48px, 10vw, 80px); line-height: 1;
      background: linear-gradient(135deg, white, #c4b5fd);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 16px;
    }
    p { font-size: 18px; opacity: 0.65; max-width: 380px; line-height: 1.7; margin-bottom: 32px; }
    .btn {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white; font-family: 'Nunito', sans-serif;
      font-weight: 900; font-size: 17px;
      padding: 16px 36px; border-radius: 100px;
      border: none; cursor: pointer;
      transition: transform 0.15s;
    }
    .btn:hover { transform: scale(1.05); }
    .tip {
      margin-top: 32px; font-size: 13px; opacity: 0.4;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; padding: 12px 20px;
    }
  </style>
</head>
<body>
  <div class="icon">🚀</div>
  <h1>NO SIGNAL</h1>
  <p>Looks like you're offline! Check your connection and try again — Code Quest will be waiting for you.</p>
  <button class="btn" onclick="window.location.reload()">Try Again</button>
  <div class="tip">💡 Tip: Once you've loaded Code Quest once, most of it works offline!</div>
</body>
</html>
