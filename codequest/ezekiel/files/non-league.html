  ontop:["This is all {c}.","We look the only side likely to score.","They can't get near it at the moment."]
};
const fill=(s,o)=>s.replace("{p}",(o&&o.p)||"").replace("{gk}",(o&&o.gk)||"").replace("{c}",G?esc(CS()):"");
function fresh(arr){
  if(!M)return pick(arr);
  for(let i=0;i<6;i++){const c=pick(arr);if(c!==M.lastLine){M.lastLine=c;return c;}}
  return pick(arr);
}

function startMatch(){
  const {home,opp}=myFixture();
  const accurate=Math.random()<(0.72+0.12*G.scoutBonus);
  const oppTac=accurate?opp.style:pick(TKEYS);
  const spare=available().filter(p=>!G.xi.includes(p.id));
  const bgk=spare.filter(p=>p.pos==="GK").sort((a,b)=>power(b)-power(a))[0];
  const bout=spare.filter(p=>p.pos!=="GK").sort((a,b)=>power(b)-power(a)).slice(0,bgk?4:5);
  M={minute:0,gf:0,ga:0,mom:0,half:1,bi:0,subs:3,speed:1,done:false,
     home,opp,oppTac,oppForm:opp.form,
     onPitch:[...G.xi],bench:(bgk?[bgk.id]:[]).concat(bout.map(p=>p.id)),
     mfit:{},rt:{},knock:{},yel:{},
     attMod:1,defMod:1,midMod:1,drainMod:1,agg:0,edge:1,
     fired:{},decisions:0,pending:null,log:[],scorers:[],
     st:{sh:[0,0],sot:[0,0],cor:[0,0]},heat:heat(opp.id),lateGoal:0,
     tac:G.tactic,form:G.formation};
  squadList().forEach(p=>{M.mfit[p.id]=p.fit;M.rt[p.id]=6.0;});

  const t=G.talk;
  if(t==="calm"){G.morale=clamp(G.morale+2,0,100);M.mom+=6;}
  if(t==="demand"){M.agg+=1;if(G.morale>=55)M.mom+=14;else{M.mom-=12;G.morale=clamp(G.morale-4,0,100);}}
  if(t==="fire"){M.agg+=2;if(G.morale>=45)M.mom+=20;else{M.mom-=14;G.morale=clamp(G.morale-5,0,100);}}
  if(t==="chalk")M.edge+=0.05;
  if(t==="arm"){M.onPitch.forEach(id=>{const p=P(id);if(p.happy<50)M.rt[id]=6.2;});
    M.mom+=Math.round(avg(M.onPitch.map(id=>P(id).happy))/12);}
  if(M.home)M.mom+=8;
  M.mom=clamp(M.mom,-100,100);
  if(G.promised&&!G.xi.includes(G.promised)&&P(G.promised)){P(G.promised).happy=clamp(P(G.promised).happy-22,0,100);}
  G.promised=null;

  if(M.home)M.mom+=Math.round(M.heat/14);
  if(M.heat>=50)addLine(0,(M.heat>=75?"<b>Derby day.</b> ":"")+"There are people in this ground who have waited all year for this.","big");
  addLine(0,"Kick-off. "+(M.home?esc(ST()):"Away from home")+", "+G.formation+", "+TACTICS[G.tactic].name.toLowerCase()+".","big");
  G.stage="match";renderMatch();schedule();
}

function strengths(){
  const on=M.onPitch.map(P);
  const eff=p=>p.ab*(0.60+0.40*M.mfit[p.id]/100)*(1+p.form/70)*(0.95+0.05*p.happy/100)*(M.knock[p.id]?0.82:1)*(M.calm===p.id?0.96:1);
  const grp=pos=>on.filter(p=>p.pos===pos);
  const boost=arr=>avg(arr.map(p=>eff(p)*(p.trait==="wall"?1.07:p.trait==="shotstop"?1.09:1)));
  const D=grp("DEF").length?boost(grp("DEF")):avg(on.map(eff))*0.85;
  const Mi=grp("MID").length?avg(grp("MID").map(eff)):avg(on.map(eff))*0.85;
  const F=grp("FWD").length?avg(grp("FWD").map(eff)):avg(on.map(eff))*0.8;
  const Gk=grp("GK").length?boost(grp("GK")):34;
  const fm=FORMS[M.form],tc=TACTICS[M.tac];
  const cyc=TACTICS[M.tac].beats===M.oppTac?0.10:(TACTICS[M.oppTac].beats===M.tac?-0.10:0);
  const numbers=Math.pow(M.onPitch.length/11,0.7);
  const edge=M.edge+cyc;
  const dp=m=>1+(m-1)*0.55,tire=1-(M.minute||0)/950;
  return {
    att:(F*0.52+Mi*0.33+D*0.15)*fm.att*tc.att*M.attMod*(1+M.agg*0.025)*edge*numbers,
    def:(D*0.50+Gk*0.26+Mi*0.24)*fm.def*tc.def*M.defMod*edge*numbers,
    mid:Mi*fm.mid*tc.mid*M.midMod,
    oppAtt:M.opp.str*dp(FORMS[M.oppForm].att)*dp(TACTICS[M.oppTac].att)*(M.home?0.96:1.05)*tire,
    oppDef:M.opp.str*dp(FORMS[M.oppForm].def)*dp(TACTICS[M.oppTac].def)*tire,
    oppMid:M.opp.str*dp(FORMS[M.oppForm].mid)*dp(TACTICS[M.oppTac].mid)*tire
  };
}
function addLine(min,text,cls){
  M.log.push({min,text,cls:cls||""});
  const feed=document.getElementById("feed");
  if(feed){const d=document.createElement("div");d.className="ln "+(cls||"");
    d.innerHTML='<span class="m">'+(min?min+"'":"")+'</span><span class="t">'+text+'</span>';
    feed.appendChild(d);feed.scrollTop=feed.scrollHeight;}
}
function shooter(){
  const on=M.onPitch.map(P),w=[];
  on.forEach(p=>{const n=p.pos==="FWD"?5:p.pos==="MID"?3:p.pos==="DEF"?1:0;for(let i=0;i<n;i++)w.push(p);});
  return w.length?pick(w):on[0];
}
const scoreText=()=>M.home?M.gf+"–"+M.ga:M.ga+"–"+M.gf;
const gkOn=()=>M.onPitch.map(P).find(p=>p.pos==="GK");

/* ---------- penalties ---------- */
function dTakePen(){
  const cands=M.onPitch.map(P).filter(p=>p.pos!=="GK").sort((a,b)=>penSkill(b)-penSkill(a)).slice(0,3);
  return {kind:"pens",title:"Penalty to "+CS(),body:"The referee points to the spot and the ground goes quiet. Somebody has to pick the ball up.",
    opts:cands.map(p=>({label:surname(p.name),note:"Composure "+penSkill(p)+(p.trait==="ice"?" · Ice":""),fn(){takePen(p);}}))};
}
function takePen(p){
  M.st.sh[0]++;
  const score=Math.random()<clamp(0.53+penSkill(p)/240,0.4,0.96);
  if(score){
    M.st.sot[0]++;M.gf++;M.scorers.push(p.id);M.rt[p.id]=(M.rt[p.id]||6)+1.3;M.mom=clamp(M.mom+24,-100,100);
    addLine(M.minute,"<b>"+esc(p.name)+"</b> sends the keeper the wrong way. <b>"+scoreText()+"</b>","goal");
  } else {
    M.rt[p.id]=(M.rt[p.id]||6)-1.2;M.mom=clamp(M.mom-16,-100,100);
    p.happy=clamp(p.happy-6,0,100);
    addLine(M.minute,"<b>"+esc(p.name)+"</b> "+pick(["hits the post.","puts it over the bar. He cannot look up.","sees it saved low to the keeper's left."]),"card");
  }
}
function dFacePen(){
  const gk=gkOn();
  const hint=G.scoutBonus
    ? "Your video work says their taker goes <b>"+(M.penHint=pick(["left","right"]))+"</b> nine times out of ten."
    : "Nobody knows anything about their taker.";
  return {kind:"pens",title:"Penalty against "+CS(),body:(gk?esc(gk.name):"The keeper")+" is looking at you. "+hint,
    opts:[{label:"Dive left",note:"Commit early",fn(){facePen("left");}},
          {label:"Dive right",note:"Commit early",fn(){facePen("right");}},
          {label:"Stand up",note:"Wait, and hope",fn(){facePen("stand");}}]};
}
function facePen(call){
  const gk=gkOn();
  const truth=G.scoutBonus&&Math.random()<0.8?M.penHint:pick(["left","right"]);
  let save=0.14+(gk&&gk.trait==="shotstop"?0.13:0);
  if(call===truth)save+=0.34; else if(call==="stand")save+=0.13;
  M.st.sh[1]++;
  if(Math.random()<save){
    if(gk)M.rt[gk.id]=(M.rt[gk.id]||6)+1.6;
    M.mom=clamp(M.mom+22,-100,100);
    addLine(M.minute,"<b>SAVED.</b> "+(gk?esc(gk.name):"The keeper")+" "+(call==="stand"?"stands up and blocks it with his legs.":"goes "+call+" and gets a strong hand to it."),"goal");
  } else {
    M.st.sot[1]++;M.ga++;M.mom=clamp(M.mom-20,-100,100);
    addLine(M.minute,"Penalty scored. "+(call==="stand"?"He waited, and it went past him.":"Wrong way.")+" <b>"+scoreText()+"</b>","conceded");
  }
}
function dLastMan(p){
  return {title:"Last man",body:"Their striker is away from "+esc(p.name)+" with only the keeper to beat. He can take him down, and he will walk for it.",
    opts:[
      {label:"Take him down",note:"Penalty and a red card. Stops the certain goal.",fn(){
        M.onPitch=M.onPitch.filter(id=>id!==p.id);p.__red=true;M.rt[p.id]=(M.rt[p.id]||6)-1.4;
        addLine(M.minute,"<b>"+esc(p.name)+"</b> hauls him down and walks. Down to "+M.onPitch.length+".","card");
        M.pending=dFacePen();}},
      {label:"Let him go",note:"Eleven men and a striker through on goal.",fn(){
        if(Math.random()<0.62){M.st.sh[1]++;M.st.sot[1]++;M.ga++;M.mom=clamp(M.mom-22,-100,100);
          addLine(M.minute,"He rounds the keeper and rolls it in. <b>"+scoreText()+"</b>","conceded");}
        else{const g=gkOn();if(g)M.rt[g.id]=(M.rt[g.id]||6)+1.2;M.st.sh[1]++;
          addLine(M.minute,"He goes round the keeper and puts it wide. Let off.","big");}}}]};
}

function beat(){
  if(M.pending||M.done)return;
  const min=BEATS[M.bi];
  if(min===undefined)return endMatch();
  M.bi++;M.minute=min;

  if(min===45){
    M.half=2;
    addLine(45,"Half-time. They have been playing <b>"+TACTICS[M.oppTac].name.toLowerCase()+"</b> out of a "+M.oppForm+".","big");
    M.onPitch.forEach(id=>M.mfit[id]=clamp(M.mfit[id]+4,0,100));
    if(M.gf<M.ga&&Math.random()<0.3)M.oppTac=pick(TKEYS.filter(k=>k!==M.oppTac));
    M.pending=dHalfTime();renderMatch();return;
  }

  const tc=TACTICS[M.tac];
  M.onPitch.forEach(id=>{
    const p=P(id);
    let dr=(3.4*tc.drain*M.drainMod)*(1+M.agg*0.06);
    if(p.trait==="engine")dr*=0.6;
    M.mfit[id]=clamp(M.mfit[id]-dr,0,100);
  });

  const S=strengths();
  const push=clamp((S.att-S.oppDef)/28,-1.3,1.3);
  const pushT=clamp((S.oppAtt-S.def)/28,-1.3,1.3);
  const me=clamp((S.mid-S.oppMid)/26,-1,1);
  const mf=M.mom/300;
  const pA=clamp(0.215+push*0.095+me*0.05+mf*0.085,0.03,0.52);
  const pB=clamp(0.215+pushT*0.095-me*0.05-mf*0.085,0.03,0.52);
  M.poss=clamp(50+me*16+mf*8,22,78);
  if(Math.random()<0.30)M.st.cor[me>0?0:1]++;

  let acted=false;
  if(Math.random()<pA){
    acted=true;
    if(Math.random()<0.042&&M.decisions<6){
      M.decisions++;addLine(min,"<b>Penalty!</b> He's brought down inside the box.","big");
      M.pending=dTakePen();renderMatch();return;
    }
    const s=shooter();
    M.st.sh[0]++;
    let conv=0.335+(s.trait==="poacher"?0.10:0)+(s.trait==="flair"?rnd(0.16):0)+M.mfit[s.id]/900;
    M.rt[s.id]=(M.rt[s.id]||6)+0.25;
    if(Math.random()<conv){
      M.st.sot[0]++;M.gf++;M.mom=clamp(M.mom+26,-100,100);M.scorers.push(s.id);M.rt[s.id]+=1.4;if(min>=86)M.lateGoal=1;
      M.onPitch.forEach(id=>M.rt[id]=(M.rt[id]||6)+0.08);
      addLine(min,fill(pick(LINES.goal),{p:esc(s.name)})+" <b>"+scoreText()+"</b>","goal");
    } else {
      if(Math.random()<0.5)M.st.sot[0]++;
      M.mom=clamp(M.mom+9,-100,100);
      addLine(min,fill(fresh(LINES.miss),{p:esc(s.name)}));
    }
  }
  if(Math.random()<pB){
    acted=true;
    const defs=M.onPitch.map(P).filter(p=>p.pos==="DEF");
    if(defs.length&&!M.fired.lastman&&Math.random()<0.030&&M.decisions<6&&min>=30){
      M.fired.lastman=1;M.decisions++;M.pending=dLastMan(pick(defs));renderMatch();return;
    }
    if(Math.random()<0.038&&M.decisions<6){
      M.decisions++;addLine(min,"<b>Penalty to them.</b> A clumsy challenge and the referee has no doubt.","big");
      M.pending=dFacePen();renderMatch();return;
    }
    const gk=gkOn();
    M.st.sh[1]++;
    if(Math.random()<0.335){
      M.st.sot[1]++;M.ga++;M.mom=clamp(M.mom-24,-100,100);if(min>=86)M.lateGoal=1;
      M.onPitch.map(P).filter(p=>p.pos==="DEF"||p.pos==="GK").forEach(p=>M.rt[p.id]=(M.rt[p.id]||6)-0.35);
      addLine(min,fresh(LINES.conceded)+" <b>"+scoreText()+"</b>","conceded");
    } else {
      if(Math.random()<0.5)M.st.sot[1]++;
      M.mom=clamp(M.mom-8,-100,100);
      if(gk)M.rt[gk.id]=(M.rt[gk.id]||6)+0.2;
      addLine(min,fill(fresh(LINES.oppmiss),{gk:gk?esc(gk.name):"the keeper"}));
    }
  }

  const cardP=0.05+M.agg*0.035+(M.wasting?0.05:0)+M.heat/1400;
  if(Math.random()<cardP){
    const cands=M.onPitch.map(P).filter(p=>p.pos!=="GK");
    const hot=cands.filter(p=>p.trait==="hothead");
    const p=hot.length&&Math.random()<0.55?pick(hot):pick(cands);
    if(p){
      if(M.yel[p.id]){
        M.onPitch=M.onPitch.filter(id=>id!==p.id);p.__red=true;
        addLine(min,"<b>Second yellow.</b> "+esc(p.name)+" is off. Down to "+M.onPitch.length+".","card");
        M.mom=clamp(M.mom-22,-100,100);M.rt[p.id]=(M.rt[p.id]||6)-1.6;
      } else {
        M.yel[p.id]=1;
        addLine(min,esc(p.name)+" is booked for a late one.","card");
        if(!M.fired.booking&&M.agg>=1&&M.decisions<6){M.fired.booking=1;M.decisions++;M.pending=dBooking(p);renderMatch();return;}
      }
      acted=true;
    }
  }
  const inj=0.028+(M.agg*0.006)-(G.robust*0.008);
  M.onPitch.slice().forEach(id=>{
    const p=P(id);
    if(M.knock[id]||!p)return;
    const r=inj*(p.trait==="fragile"?2.0:1)*(M.mfit[id]<40?1.8:1);
    if(Math.random()<r/11){
      M.knock[id]=1;acted=true;
      addLine(min,"<b>"+esc(p.name)+"</b> is down and the physio is on.","card");
      if(M.subs>0&&M.decisions<6&&!M.fired["h"+id]){M.fired["h"+id]=1;M.decisions++;M.pending=dHurt(p);}
    }
  });
  if(M.pending){renderMatch();return;}

  if(!acted){
    if(M.mom<=-45)addLine(min,fresh(LINES.pinned));
    else if(M.mom>=45)addLine(min,fresh(LINES.ontop));
    else if(M.heat>=55&&Math.random()<0.45)addLine(min,fresh(LINES.derby));
    else addLine(min,fill(fresh(LINES.filler),{p:esc(pick(M.onPitch.map(P)).name)}));
  }
  M.mom=clamp(M.mom*0.86,-100,100);
  const d=checkTrigger();
  if(d){M.decisions++;M.pending=d;renderMatch();return;}
  syncBoard();schedule();
}

/* ================= in-play decisions ================= */
function dHalfTime(){
  const s=M.gf-M.ga;
  const mood=s>0?"You are in front and they know it.":s<0?"You are behind and the shape isn't working.":"Level. It's there to be won.";
  return {title:"Half-time",body:mood+" You have six minutes and their full attention.",opts:[
    {label:"Calm heads",note:"Water, breathe, same again. Everyone gets a blow.",fn(){
      M.onPitch.forEach(id=>M.mfit[id]=clamp(M.mfit[id]+6,0,100));M.mom=clamp(M.mom+10,-100,100);
      addLine(45,"Quiet dressing room. They come out settled.");}},
    {label:"Rip into them",note:"Loud. Lifts them, and they'll fly into things.",fn(){
      M.mom=clamp(M.mom+26,-100,100);M.agg+=1;M.onPitch.forEach(id=>M.mfit[id]=clamp(M.mfit[id]-2,0,100));
      M.onPitch.forEach(id=>{const p=P(id);if(p.pers==="bigtime")p.happy=clamp(p.happy-5,0,100);});
      addLine(45,"You can hear him through the wall. They come out flying.");}},
    {label:"Change the shape",note:"Rework it around what they're actually doing.",fn(){M.pending={kind:"shape"};}},
    {label:"Make a change",note:"Someone's afternoon ends here.",fn(){M.pending={kind:"subs",off:null};}}
  ]};
}
function dHurt(p){
  return {title:esc(p.name)+" is struggling",body:"He's taken a knock and he's moving badly. He can carry on, but he isn't the same player and it could get worse.",opts:[
    {label:"Take him off",note:"Sensible. Uses one of your three.",fn(){M.pending={kind:"subs",off:p.id};}},
    {label:"Strap him up",note:"He plays on at about eighty per cent.",fn(){addLine(M.minute,esc(surname(p.name))+" is strapped up and waves the physio away.");}}
  ]};
}
function dBooking(p){
  return {title:esc(p.name)+" is on a yellow",body:"He's still flying into everything and the referee has him in mind. One more and you're down to ten.",opts:[
    {label:"Withdraw him",note:"No risk. Costs a substitution.",fn(){M.pending={kind:"subs",off:p.id};}},
    {label:"Tell him to calm down",note:"Backs off. Less effective, far less likely to walk.",fn(){
      M.calm=p.id;M.agg=Math.max(0,M.agg-1);addLine(M.minute,esc(surname(p.name))+" gets the message and pulls out of one.");}},
    {label:"Leave him",note:"He's your best player out there. Gamble.",fn(){addLine(M.minute,"You leave him on. The referee is watching.");}}
  ]};
}
function checkTrigger(){
  if(M.decisions>=6||M.minute<28)return null;
  if(!M.fired.chase&&M.minute>=62&&M.gf<M.ga){M.fired.chase=1;return{title:"Chasing it",body:"The clock is going and you're behind. Something has to change.",opts:[
    {label:"Throw a forward on",note:"More bodies up, fewer back.",fn(){M.attMod+=0.13;M.defMod-=0.11;M.pending={kind:"subs",off:null};}},
    {label:"Push the line up",note:"Squeeze the pitch. Costs legs, leaves space.",fn(){M.attMod+=0.10;M.defMod-=0.09;M.drainMod+=0.3;addLine(M.minute,"The back line steps up twenty yards.");}},
    {label:"Stay patient",note:"Panic loses more games than it wins.",fn(){M.mom=clamp(M.mom+8,-100,100);addLine(M.minute,"No change. Keep doing it properly.");}}]};}
  if(!M.fired.protect&&M.minute>=72&&M.gf>M.ga){M.fired.protect=1;return{title:"Seeing it out",body:"You're in front with less than twenty to play. They're going to come.",opts:[
    {label:"Shut up shop",note:"Everyone behind the ball.",fn(){M.defMod+=0.19;M.attMod-=0.22;M.drainMod-=0.15;addLine(M.minute,"Two banks of four, forty yards from their goal.");}},
    {label:"Keep going",note:"A second goal settles it better than a wall does.",fn(){addLine(M.minute,"No change. Still going for the throat.");}},
    {label:"Waste a bit of time",note:"Ball in the corner. The referee won't love it.",fn(){M.mom=clamp(M.mom+15,-100,100);M.wasting=1;addLine(M.minute,"Ball in the corner, arms out, howls from the away end.");}}]};}
  if(!M.fired.siege&&M.mom<=-52){M.fired.siege=1;return{title:"Under siege",body:"They've had the ball for ten minutes and it's only going one way.",opts:[
    {label:"Drop deeper",note:"Concede territory, protect the box.",fn(){M.defMod+=0.15;M.attMod-=0.13;M.mom=clamp(M.mom+20,-100,100);addLine(M.minute,"We drop off and get men behind the ball.");}},
    {label:"Ride it out",note:"Storms pass. Sometimes.",fn(){M.mom=clamp(M.mom+9,-100,100);addLine(M.minute,"No change. Heads down, get through it.");}},
    {label:"Go again",note:"Press them. Break the rhythm or break yourselves.",fn(){M.attMod+=0.11;M.defMod-=0.08;M.drainMod+=0.35;addLine(M.minute,"We go after them instead. Bold.");}}]};}
  if(!M.fired.ontop&&M.mom>=56&&M.gf<=M.ga){M.fired.ontop=1;return{title:"On top",body:"You're all over them and it isn't on the scoreboard yet.",opts:[
    {label:"Go for the throat",note:"Push everyone forward while they're rocking.",fn(){M.attMod+=0.15;M.defMod-=0.12;addLine(M.minute,"Full-backs pushed right up. This is the moment.");}},
    {label:"Keep the shape",note:"It's working. Don't touch it.",fn(){M.mom=clamp(M.mom+7,-100,100);addLine(M.minute,"Nothing changes. Same again.");}}]};}
  return null;
}
function doSub(offId,onId){
  M.onPitch=M.onPitch.map(id=>id===offId?onId:id);
  M.bench=M.bench.filter(id=>id!==onId);
  M.mfit[onId]=P(onId).fit;M.subs--;
  delete M.knock[offId];
  const off=P(offId);
  if(off&&off.pers==="bigtime")off.happy=clamp(off.happy-6,0,100);
  P(onId).happy=clamp(P(onId).happy+4,0,100);
  addLine(M.minute,"<b>Change.</b> "+esc(P(onId).name)+" on for "+esc(off.name)+".","big");
  M.pending=null;renderMatch();schedule();
}
function changeShape(k){
  M.form=k;addLine(M.minute,"<b>Shape change.</b> We go "+k+".","big");
  M.pending=null;renderMatch();schedule();
}

/* ================= match rendering ================= */
function boardHtml(){
  const usPct=Math.round((M.mom+100)/2);
  const names=M.home?[CS(),M.opp.name]:[M.opp.name,CS()];
  const sc=M.home?[M.gf,M.ga]:[M.ga,M.gf];
  const s=M.st,ours=M.home?0:0;
  const poss=Math.round(M.poss||50);
  const L=(a,b)=>M.home?[a,b]:[a,b];
  return '<div class="clock">'+(M.done?"Full time":'<span class="dot"></span>'+(M.minute||0)+"'"+(M.half===2?" · second half":""))+'</div>'+
    '<div class="bigscore"><div class="tn">'+esc(names[0])+'</div><div class="nums">'+sc[0]+' <span style="opacity:.4">–</span> '+sc[1]+'</div><div class="tn">'+esc(names[1])+'</div></div>'+
    '<div class="mom"><i class="us" style="width:'+usPct+'%"></i><i class="them" style="width:'+(100-usPct)+'%"></i></div>'+
    '<div class="momlab"><span>'+esc(CS())+'</span><span>Momentum</span><span>'+esc(M.opp.name)+'</span></div>'+
    '<div class="strip">'+
      '<div class="l">'+poss+'%</div><div class="lab">Possession</div><div class="r">'+(100-poss)+'%</div>'+
      '<div class="poss"><i class="a" style="width:'+poss+'%"></i><i class="b" style="width:'+(100-poss)+'%"></i></div>'+
      '<div class="l">'+s.sh[0]+'</div><div class="lab">Shots</div><div class="r">'+s.sh[1]+'</div>'+
      '<div class="l">'+s.sot[0]+'</div><div class="lab">On target</div><div class="r">'+s.sot[1]+'</div>'+
      '<div class="l">'+s.cor[0]+'</div><div class="lab">Corners</div><div class="r">'+s.cor[1]+'</div>'+
    '</div>';
}
function syncBoard(){const b=document.getElementById("board");if(b)b.innerHTML=boardHtml();}
function ctrlHtml(){
  if(M.pending){
    const p=M.pending;
    if(p.kind==="pens"){
      return '<div class="panel decide goalflash"><h2 class="head">'+p.title+'</h2><p class="hint">'+p.body+'</p><div class="pens">'+
        p.opts.map((o,i)=>'<button data-dec="'+i+'"><strong>'+esc(o.label)+'</strong><em>'+esc(o.note)+'</em></button>').join("")+'</div></div>';
    }
    if(p.kind==="shape"){
      return '<div class="panel decide"><h2 class="head">Change the shape</h2><p class="hint">They are playing '+
        TACTICS[M.oppTac].name.toLowerCase()+' out of a '+M.oppForm+'.</p><div class="grid2">'+
        FKEYS.map(k=>'<button class="opt" data-shape="'+k+'" aria-pressed="'+(M.form===k)+'"><strong>'+k+'</strong><em>'+esc(FORMS[k].note)+'</em></button>').join("")+'</div></div>';
    }
    if(p.kind==="subs"){
      if(M.subs<=0)return '<div class="panel decide"><h2 class="head">No changes left</h2><p class="hint">All three used.</p><button class="go ghost" id="cancelsub">Back to the match</button></div>';
      if(p.off===null||p.off===undefined){
        return '<div class="panel decide"><h2 class="head">Who comes off?<span class="cnt">'+M.subs+' left</span></h2>'+
          '<p class="hint">Fitness shown is where he is right now, not this morning.</p><div class="plist">'+
          M.onPitch.map(id=>{const q=P(id);const q2=Object.assign({},q,{fit:M.mfit[id]});
            return playerRow(q2,{action:1}).replace('data-p="'+q.id+'"','data-off="'+q.id+'"');}).join("")+
          '</div><button class="go ghost" id="cancelsub" style="margin-top:12px">Back to the match</button></div>';
      }
      const off=P(p.off);
      return '<div class="panel decide"><h2 class="head">Who comes on for '+esc(surname(off.name))+'?</h2>'+
        '<p class="hint">Positions need not match. You will feel it if they don\'t.</p><div class="plist">'+
        (M.bench.length?M.bench.map(id=>playerRow(P(id),{action:1}).replace('data-p="'+id+'"','data-on="'+id+'"')).join("")
          :'<p class="note">Nobody left on the bench.</p>')+
        '</div><button class="go ghost" id="backsub" style="margin-top:12px">Someone else comes off</button></div>';
    }
    return '<div class="panel decide"><h2 class="head">'+p.title+'</h2><p class="hint">'+p.body+'</p><div class="grid2">'+
      p.opts.map((o,i)=>'<button class="opt" data-dec="'+i+'"><strong>'+esc(o.label)+'</strong><em>'+esc(o.note)+'</em></button>').join("")+'</div></div>';
  }
  if(M.done)return "";
  return '<div class="panel"><div class="speed">'+
    [["1","1×"],["2","2×"],["0","Skip"]].map(([v,l])=>'<button data-sp="'+v+'" aria-pressed="'+(M.speed==+v)+'">'+l+'</button>').join("")+
    '</div><button class="go ghost" id="opensub" style="margin:12px 0 0" '+(M.subs<=0?"disabled":"")+'>'+
    (M.subs>0?"Bring someone on ("+M.subs+" left)":"No substitutions left")+'</button></div>';
}
function renderMatch(){
  setPills('<div class="pill pulse" style="border-color:var(--red);color:var(--red)">Live</div>');
  stage.innerHTML='<div class="panel board" id="board">'+boardHtml()+'</div><div id="ctrl">'+ctrlHtml()+'</div>'+
    '<div class="panel"><h2 class="head">Commentary</h2><div class="feed" id="feed">'+
    M.log.map(l=>'<div class="ln '+l.cls+'" style="animation:none"><span class="m">'+(l.min?l.min+"'":"")+'</span><span class="t">'+l.text+'</span></div>').join("")+
    '</div></div>';
  const f=document.getElementById("feed");if(f)f.scrollTop=f.scrollHeight;
  bindMatch();
}
function bindMatch(){
  stage.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>{M.speed=+b.dataset.sp;renderMatch();schedule();});
  const os=document.getElementById("opensub");if(os)os.onclick=()=>{clearTimeout(timer);M.pending={kind:"subs",off:null};renderMatch();};
  const cs=document.getElementById("cancelsub");if(cs)cs.onclick=()=>{M.pending=null;renderMatch();schedule();};
  const bs=document.getElementById("backsub");if(bs)bs.onclick=()=>{M.pending={kind:"subs",off:null};renderMatch();};
  stage.querySelectorAll("[data-off]").forEach(b=>b.onclick=()=>{M.pending={kind:"subs",off:+b.dataset.off};renderMatch();});
  stage.querySelectorAll("[data-on]").forEach(b=>b.onclick=()=>doSub(M.pending.off,+b.dataset.on));
  stage.querySelectorAll("[data-shape]").forEach(b=>b.onclick=()=>changeShape(b.dataset.shape));
  stage.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>{
    const o=M.pending.opts[+b.dataset.dec];M.pending=null;o.fn();
    renderMatch();if(!M.pending)schedule();});
}
function schedule(){
  clearTimeout(timer);
  if(!M||M.pending||M.done)return;
  timer=setTimeout(beat,M.speed===0?0:Math.round(1150/M.speed));
}

/* ================= end of match ================= */
function endMatch(){
  M.done=true;clearTimeout(timer);
  const res=M.gf>M.ga?"W":M.gf===M.ga?"D":"L";
  addLine(90,"<b>Full time.</b> "+scoreText()+".","big");

  const played=[...new Set([...G.xi,...M.onPitch])].filter(id=>P(id));
  played.forEach(id=>{
    const p=P(id);p.apps++;p.since=0;p.fit=clamp(M.mfit[id],0,100);
    const r=clamp(M.rt[id]||6,3.5,9.9);
    p.form=clamp(p.form+(r>=7.2?2.5:r<=5.4?-2.5:0.3),-10,10);
    p.happy=clamp(p.happy+(r>=7.2?3:1)+(res==="W"?2:res==="L"?-1:0),0,100);
  });
  squadList().forEach(p=>{if(!played.includes(p.id))p.fit=clamp(p.fit+4,0,100);});
  M.scorers.forEach(id=>{const p=P(id);if(p){p.goals++;p.happy=clamp(p.happy+5,0,100);}});
  Object.keys(M.knock).forEach(id=>{const p=P(+id);if(p&&Math.random()<0.55)p.out=1+Math.floor(Math.random()*2.4);});
  Object.keys(M.yel).forEach(id=>{const p=P(+id);if(p){p.yel++;if(p.yel>=5){p.ban=1;p.yel=0;}}});
  squadList().forEach(p=>{if(p.__red){p.ban=1;delete p.__red;M.reds=(M.reds||0)+1;}});

  G.fixtures[G.week-1].forEach(([a,b])=>{
    if(a===0||b===0)return;
    const A=G.teams[a],B=G.teams[b],s=A.str+4+rnd(14)-(B.str+rnd(14));
    record(A,B,Math.max(0,Math.round(1.25+s/17+rnd(1.3))),Math.max(0,Math.round(1.25-s/17+rnd(1.3))));
  });
  record(G.teams[0],M.opp,M.gf,M.ga);
  G.teams.forEach(x=>{if(x.id)x.str=clamp(x.str+0.25+rnd(1.2),38,86);});
  G.formRun.push(res);

  const hm=1+heat(M.opp.id)/110;
  G.morale=clamp(G.morale+(res==="W"?6*hm:res==="D"?0:-10*hm),0,100);
  const att=Math.round((420+G.morale*5+(13-myPos())*38+rnd(60))*(G.capacityHit?0.72:1)*(1+heat(M.opp.id)/170));
  const gate=M.home?att*9:0;
  G.cash+=gate-wageBill()+(OW().inc||0)-COACHES[G.coach].cost;
  if(G.pendingSponsor){G.cash+=12000;G.pendingSponsor=0;G.lateSponsor=1;}
  if(G.taxDue>0){G.cash-=2500;G.taxDue--;}
  if(G.cash<0)G.wentIntoDebt=true;
  const pos=myPos();
  let db=OW().week(G,res,pos);
  db*=1+heat(M.opp.id)/150;
  if(G.week<=5)db=Math.max(db,-1);
  G.board=clamp(G.board+db,0,100);

  let dh=4;
  if(Math.abs(M.gf-M.ga)>=3)dh+=9;
  if(Object.keys(M.yel).length>=3)dh+=4;
  if(M.reds)dh+=11;
  if(M.lateGoal)dh+=7;
  const gap=Math.abs(table().findIndex(t=>t.id===0)-table().findIndex(t=>t.id===M.opp.id));
  if(gap<=2)dh+=5;
  bumpHeat(M.opp.id,dh);
  G.teams.forEach(t=>{if(t.id&&t.id!==M.opp.id)G.riv[t.id]=Math.max(0,(G.riv[t.id]||0)-1.5);});
  G.lastMeet=G.lastMeet||{};G.lastMeet[M.opp.id]={gf:M.gf,ga:M.ga,home:M.home,week:G.week};

  const r=G.records,mar=M.gf-M.ga;
  if(mar>0&&(r.bigWinM===undefined||mar>r.bigWinM)){r.bigWinM=mar;r.bigWin=M.gf+"–"+M.ga+" v "+surname(M.opp.name);}
  if(mar<0&&(r.bigLossM===undefined||mar<r.bigLossM)){r.bigLossM=mar;r.bigLoss=M.gf+"–"+M.ga+" v "+surname(M.opp.name);}
  if(att>r.crowd)r.crowd=att;
  if(res==="L")r.run=0;else{r.run++;if(r.run>r.unbeaten)r.unbeaten=r.run;}
  const isDerby=heat(M.opp.id)>=60||M.opp.id===G.derbyId;
  if(isDerby){if(res==="W")r.derbyW++;if(res==="L")r.derbyL++;}
  const line=(M.home?esc(CS())+" "+M.gf+"–"+M.ga+" "+esc(M.opp.name):esc(M.opp.name)+" "+M.ga+"–"+M.gf+" "+esc(CS()));
  const extras=[];
  if(isDerby)extras.push(res==="W"?"They will talk about this one.":res==="L"?"A long bus home.":"Honours even, nobody satisfied.");
  if(M.lateGoal&&Math.abs(mar)<=1)extras.push("Settled in the last five minutes.");
  if(M.reds)extras.push("Down to ten.");
  if(Math.abs(mar)>=4)extras.push("A hiding, one way or the other.");
  const tally={};M.scorers.forEach(id=>tally[id]=(tally[id]||0)+1);
  Object.keys(tally).forEach(id=>{if(tally[id]>=3&&P(+id))extras.push("<b>"+esc(P(+id).name)+"</b> hat-trick.");});
  logHist("<b>"+line+"</b>"+(extras.length?" "+extras.join(" "):""),(isDerby?"derby ":"")+(res==="W"?"win":res==="L"?"loss":""));

  const tacText=TACTICS[M.tac].beats===M.oppTac
    ? "Our "+TACTICS[M.tac].name.toLowerCase()+" was exactly the wrong thing for them to face. That was the game."
    : TACTICS[M.oppTac].beats===M.tac
    ? "They set up "+TACTICS[M.oppTac].name.toLowerCase()+" and it picked our "+TACTICS[M.tac].name.toLowerCase()+" apart."
    : "Nothing much between the two shapes. It came down to the players.";
  G.last={res,gf:M.gf,ga:M.ga,home:M.home,opp:M.opp,att,gate,tacText,st:M.st,poss:Math.round(M.poss||50),
    ratings:played.map(id=>({id,r:clamp(M.rt[id]||6,3.5,9.9)})).sort((a,b)=>b.r-a.r),scorers:M.scorers.slice()};

  if(G.board<=0)G.over="sacked";
  else if(G.cash<-20000)G.over="admin";
  else if(G.week>=G.total)G.over=pos<=3?"promoted":pos>=11?"relegated":"survived";
  G.stage="post";render();
}
function record(A,B,x,y){
  A.p++;B.p++;A.gf+=x;A.ga+=y;B.gf+=y;B.ga+=x;
  if(x>y){A.w++;B.l++;A.pts+=3;}else if(x<y){B.w++;A.l++;B.pts+=3;}else{A.d++;B.d++;A.pts++;B.pts++;}
}

/* ================= post-match ================= */
function screenPost(){
  setPills();
  const L=G.last;
  const names=L.home?[CS(),L.opp.name]:[L.opp.name,CS()];
  const sc=L.home?[L.gf,L.ga]:[L.ga,L.gf];
  const verdict={W:"Won",D:"Drawn",L:"Lost"}[L.res];
  const col={W:"var(--mint)",D:"var(--amber)",L:"var(--red)"}[L.res];
  const gc={};L.scorers.forEach(id=>gc[id]=(gc[id]||0)+1);
  const scText=Object.keys(gc).length?Object.keys(gc).map(id=>esc((P(+id)||{name:"?"}).name)+(gc[id]>1?" ("+gc[id]+")":"")).join(", "):"Nobody. That's the problem.";
  const rat=L.ratings.map(r=>{
    const p=P(r.id);if(!p)return "";
    const c=r.r>=7.2?"var(--mint)":r.r<=5.4?"var(--red)":"var(--text)";
    return '<div class="ln" style="animation:none;grid-template-columns:34px 1fr 44px"><span class="pos '+p.pos+'">'+p.pos+'</span>'+
      '<span class="t">'+esc(p.name)+(gc[p.id]?' <span class="good">GOAL'+(gc[p.id]>1?" ×"+gc[p.id]:"")+'</span>':'')+'</span>'+
      '<span style="font-family:var(--num);font-weight:700;text-align:right;color:'+c+'">'+r.r.toFixed(1)+'</span></div>';
  }).join("");
  const st=L.st;
  stage.innerHTML=
    '<div class="panel board"><div class="clock">Full time — '+(L.home?"Ashfield Road":"Away")+' · '+L.att.toLocaleString("en-GB")+' in</div>'+
    '<div class="bigscore"><div class="tn">'+esc(names[0])+'</div><div class="nums">'+sc[0]+' <span style="opacity:.4">–</span> '+sc[1]+'</div><div class="tn">'+esc(names[1])+'</div></div>'+
    '<div style="font-family:var(--display);letter-spacing:4px;text-transform:uppercase;font-size:14px;color:'+col+'">'+verdict+'</div>'+
    '<div class="strip"><div class="l">'+L.poss+'%</div><div class="lab">Possession</div><div class="r">'+(100-L.poss)+'%</div>'+
    '<div class="poss"><i class="a" style="width:'+L.poss+'%"></i><i class="b" style="width:'+(100-L.poss)+'%"></i></div>'+
    '<div class="l">'+st.sh[0]+'</div><div class="lab">Shots</div><div class="r">'+st.sh[1]+'</div>'+
    '<div class="l">'+st.sot[0]+'</div><div class="lab">On target</div><div class="r">'+st.sot[1]+'</div></div></div>'+
    '<div class="cols"><div class="panel"><h2 class="head">Match report</h2><p class="report">'+esc(L.tacText)+'</p>'+
    '<p class="note">Scorers: '+scText+'</p>'+
    '<p class="note" style="margin-top:8px">Gate '+(L.gate?money(L.gate):"— (away)")+' &nbsp;·&nbsp; wages −'+money(wageBill())+
    (G.lateSponsor?' &nbsp;·&nbsp; <span class="good">a bigger sponsor came through: +£12,000</span>':'')+
    (squadFit()<45?' &nbsp;·&nbsp; <span class="bad">the squad is running on empty</span>':'')+
    (G.morale<35?' &nbsp;·&nbsp; <span class="bad">the dressing room has gone quiet</span>':'')+'</p>'+formStrip()+'</div>'+
    '<div class="panel"><h2 class="head">Player ratings</h2><p class="hint">Out of ten, and they will remember it.</p>'+rat+'</div></div>'+
    (G.over?"":'<button class="go" id="next">Start week '+(G.week+1)+'</button>')+tablePanel();
  G.lateSponsor=0;
  if(G.over){setTimeout(screenEnd,700);return;}
  document.getElementById("next").onclick=()=>{
    G.week++;G.tactic=null;G.talk=null;G.stage="week";G.tab="training";G.outcome=null;
    rollMarket();
    if(G.week===1||G.week===12){
      const room=FACILITIES[G.fac].cap-G.academy.length;
      const n=Math.min(room,1+Math.floor(Math.random()*2)+(G.fac>=2?1:0));
      for(let i=0;i<n;i++)G.academy.push(makeYouth());
      if(n>0)logHist("Academy intake: "+n+" new "+(n>1?"prospects":"prospect")+" through the door.");
    }
    const pool=EVENTS.concat(OFFEVENTS).filter(e=>!e.when||e.when(G));
    const bag=[];pool.forEach(e=>{for(let i=0;i<(e.w||1);i++)bag.push(e);});
    G.event=null;
    if(bag.length&&Math.random()<0.62){for(let a=0;a<6&&!G.event;a++)G.event=bag[Math.floor(Math.random()*bag.length)].make(G);}
    render();};
}
function screenEnd(){
  const pos=myPos(),me=G.teams[0];
  const league={
    promoted:["Promoted","Top three. However the owner feels about it, the division is different next year."],
    survived:["Mid-table","No parade, no inquest."],
    relegated:["Relegated","Bottom two. That part is not open to interpretation."],
    sacked:["Dismissed","The board ran out of patience before the season ran out of Saturdays."],
    admin:["Administration","The wages went unpaid. Points deducted, staff let go, and none of it was about football."]
  }[G.over];
  let v;
  if(G.over==="sacked")v={ok:false,t:"Sacked",x:esc(OW().who)+" lost patience in "+ord(G.week)+" week. Whatever the brief was, you will not be finishing it."};
  else if(G.over==="admin")v={ok:false,t:"Administration",x:"You ran the club out of money. No owner survives that conversation, least of all yours."};
  else v=OW().verdict(G);
  const r=G.records;
  const hi=G.history.filter(h=>h.kind&&h.kind!=="seed").slice(0,6)
    .map(h=>'<div class="histrow '+h.kind+'"><span class="w">W'+String(h.week).padStart(2,"0")+'</span><span>'+h.txt+'</span></div>').join("");
  const derby=G.teams[G.derbyId];
  stage.innerHTML=
    '<div class="panel centered brief" style="border-color:'+(v.ok?"rgba(94,242,192,.45)":"rgba(255,95,107,.45)")+'">'+
      '<div style="font-family:var(--num);font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--dim)">'+esc(OW().who)+' · verdict</div>'+
      '<div class="big" style="background:linear-gradient(96deg,#fff,'+(v.ok?"var(--mint)":"var(--red)")+');-webkit-background-clip:text;background-clip:text">'+esc(v.t)+'</div>'+
      '<p style="max-width:56ch;margin:0 auto 4px">'+esc(v.x)+'</p></div>'+
    '<div class="cols"><div class="panel"><h2 class="head">'+esc(league[0])+'</h2><p class="note" style="margin-bottom:12px">'+esc(league[1])+'</p>'+
      '<div class="recs">'+
      '<div class="rec"><div class="k">Finished</div><div class="v">'+ord(pos)+'</div></div>'+
      '<div class="rec"><div class="k">Record</div><div class="v">'+me.w+'W '+me.d+'D '+me.l+'L</div></div>'+
      '<div class="rec"><div class="k">Points</div><div class="v">'+me.pts+'</div></div>'+
      '<div class="rec"><div class="k">In the bank</div><div class="v">'+money(G.cash)+'</div></div>'+
      '<div class="rec"><div class="k">Best win</div><div class="v">'+(r.bigWin||"—")+'</div></div>'+
      '<div class="rec"><div class="k">Unbeaten run</div><div class="v">'+(r.unbeaten||0)+'</div></div>'+
      '<div class="rec"><div class="k">Record crowd</div><div class="v">'+(r.crowd?r.crowd.toLocaleString("en-GB"):"—")+'</div></div>'+
      '<div class="rec"><div class="k">v '+esc(surname(derby?derby.name:"—"))+'</div><div class="v">'+r.derbyW+'W '+r.derbyL+'L</div></div>'+
      '<div class="rec"><div class="k">Top scorer</div><div class="v">'+esc(topScorerText())+'</div></div></div></div>'+
    '<div class="panel"><h2 class="head">The season they will remember</h2>'+(hi||'<p class="note">Nothing worth retelling.</p>')+'</div></div>'+
    '<button class="go" id="again">Take another job</button>'+tablePanel();
  document.getElementById("again").onclick=()=>{G=null;screenIntro();};
}
function render(){
  if(!G)return screenIntro();
  setCrest();
  if(G.over&&G.stage!=="post")return screenEnd();
  if(G.stage==="week")return screenWeek();
  if(G.stage==="matchday")return screenMatchday();
  if(G.stage==="match")return renderMatch();
  if(G.stage==="post")return screenPost();
  screenIntro();
}
screenIntro();
</script>
</body>
</html>
