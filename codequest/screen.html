<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0912">
<title>Code Quest · Room Screen</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@400;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0B0912; --stone:#15121F;
  --parch:#E9DFC7; --parch-dim:#9A8F7A;
  --gold:#D9A94C; --gold-hi:#F2CE7B;
  --phos:#45E3C4; --rubric:#CC3A2E;
  --line:rgba(217,169,76,.22); --line-soft:rgba(217,169,76,.1);
  --gothic:'Grenze Gotisch',Georgia,serif;
  --body:'DM Sans',system-ui,sans-serif;
  --sys:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--void);color:var(--parch)}
body{
  font-family:var(--body);-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;cursor:none
}
body.showcursor{cursor:default}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(50% 42% at 22% 4%, rgba(217,169,76,.15), transparent 68%),
    radial-gradient(46% 40% at 88% 96%, rgba(69,227,196,.10), transparent 70%);
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:5;opacity:.28;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px);
}

.room{
  position:relative;z-index:1;width:100%;height:100%;
  display:grid;grid-template-columns:1fr 1fr;align-items:center;
  gap:clamp(20px,4vw,64px);padding:clamp(18px,3.5vh,44px) clamp(20px,4vw,64px)
}

/* ── left: crest, countdown ── */
.left{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.crestwrap{position:relative;width:min(300px,26vw);filter:drop-shadow(0 0 52px rgba(217,169,76,.26))}
.crestwrap img{width:100%;height:auto;display:block;position:relative;z-index:1}
.gemglow{
  position:absolute;left:50.7%;top:34.9%;width:34%;padding-bottom:34%;
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;z-index:2;
  background:radial-gradient(circle,rgba(140,255,225,.85) 0%,rgba(69,227,196,.55) 16%,
             rgba(69,227,196,.22) 34%,rgba(69,227,196,0) 68%);
  mix-blend-mode:screen;animation:gemPulse 3.4s ease-in-out infinite
}
@keyframes gemPulse{
  0%,100%{opacity:.45;transform:translate(-50%,-50%) scale(.86)}
  50%    {opacity:1;transform:translate(-50%,-50%) scale(1.14)}
}

.label{
  margin-top:clamp(14px,3vh,30px);font-family:var(--sys);font-weight:700;
  font-size:clamp(10px,1.1vw,14px);letter-spacing:.34em;text-transform:uppercase;
  color:var(--phos)
}
.clock{
  font-family:var(--gothic);font-weight:800;line-height:.92;
  font-size:clamp(56px,9.5vw,150px);color:var(--gold-hi);
  letter-spacing:-.01em;font-variant-numeric:tabular-nums;
  text-shadow:0 0 60px rgba(217,169,76,.3);margin-top:.06em
}
.clock .u{font-size:.38em;color:var(--gold);margin:0 .18em 0 .04em;vertical-align:.32em}
.sub{
  margin-top:clamp(10px,2vh,20px);font-family:var(--sys);
  font-size:clamp(10px,1vw,13px);letter-spacing:.2em;text-transform:uppercase;
  color:var(--parch-dim)
}
.rule{display:flex;align-items:center;gap:12px;width:min(360px,80%);margin-top:clamp(12px,2.4vh,24px)}
.rule::before,.rule::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.rule i{width:9px;height:9px;background:var(--phos);transform:rotate(45deg);flex:none}

/* ── right: the reel ── */
.right{display:flex;flex-direction:column;min-width:0}
.stage{
  position:relative;border:1px solid var(--line-soft);border-radius:3px;
  background:#07060C;overflow:hidden;aspect-ratio:16/9;width:100%
}
.stage::after{content:"";position:absolute;inset:5px;border:1px solid rgba(217,169,76,.08);pointer-events:none}
.stage video{width:100%;height:100%;display:block;object-fit:cover;background:#07060C}
.who{
  position:absolute;left:0;right:0;bottom:clamp(8px,1.6vh,18px);text-align:center;
  font-family:var(--gothic);font-weight:700;color:var(--gold-hi);
  font-size:clamp(20px,2.6vw,40px);text-shadow:0 2px 20px rgba(0,0,0,.92);
  pointer-events:none;transition:opacity .4s
}
.bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(217,169,76,.13)}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s linear}

.dots{display:flex;justify-content:center;gap:7px;margin-top:clamp(10px,1.8vh,18px)}
.dots span{
  width:7px;height:7px;border-radius:50%;background:rgba(217,169,76,.2);
  transition:background .3s,box-shadow .3s
}
.dots span.on{background:var(--phos);box-shadow:0 0 10px var(--phos)}

.foot{
  position:fixed;left:0;right:0;bottom:clamp(8px,1.4vh,16px);text-align:center;z-index:3;
  font-family:var(--sys);font-size:clamp(8px,.78vw,11px);letter-spacing:.3em;
  text-transform:uppercase;color:rgba(154,143,122,.5)
}

.fsbtn{
  position:fixed;top:14px;right:14px;z-index:6;width:38px;height:38px;border-radius:50%;
  border:1px solid var(--line-soft);background:rgba(11,9,18,.55);color:var(--parch-dim);
  display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .3s,color .2s
}
body.showcursor .fsbtn{opacity:1}
.fsbtn:hover{color:var(--gold)}
.fsbtn svg{width:18px;height:18px}

/* portrait / narrow: stack, reel on top */
@media (max-aspect-ratio:1/1){
  .room{grid-template-columns:1fr;grid-template-rows:auto auto;align-content:center;gap:clamp(16px,3vh,34px)}
  .right{order:-1}
  .crestwrap{width:min(200px,42vw)}
  .clock{font-size:clamp(52px,17vw,110px)}
  .label{font-size:11px;letter-spacing:.28em}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .gemglow{opacity:.7;transform:translate(-50%,-50%) scale(1)}
}
</style>
</head>

  var ORDER = ['ezekiel','sophia','arthur','elsie','theodore','hannah','emma'];
  var NAMES = {ezekiel:'Ezekiel',sophia:'Sophia',arthur:'Arthur',elsie:'Elsie',
               theodore:'Theodore',hannah:'Hannah',emma:'Emma'};

  var DAY = '2026-08-01';
  var STAGES = [
    ['10:00','10:30','The Briefing'],
    ['10:30','12:00','First Forge'],
    ['12:00','12:45','The Feast'],
    ['12:45','14:15','Second Forge'],
    ['14:15','15:15','The Rehearsal'],
    ['15:15','16:15','The Telling'],
    ['16:15','16:45','The Reckoning']
  ];

  function at(hhmm){
    var p = hhmm.split(':');
    var d = new Date(DAY + 'T00:00:00');
    d.setHours(+p[0], +p[1], 0, 0);
    return d;
  }
  function two(n){ return (n < 10 ? '0' : '') + n; }

  /* ── the reel ── */
  var vid = document.getElementById('vid');
  var who = document.getElementById('who');
  var bar = document.getElementById('bar');
  var dots = document.getElementById('dots');
  var idx = 0;

  ORDER.forEach(function(){
    var s = document.createElement('span');
    dots.appendChild(s);
  });
  var dotEls = Array.prototype.slice.call(dots.children);

  function load(i){
    idx = (i + ORDER.length) % ORDER.length;
    var key = ORDER[idx];
    who.textContent = NAMES[key];
    bar.style.width = '0%';
    vid.poster = POSTERS[key];
    vid.src = 'codequest-' + key + '.mp4';
    dotEls.forEach(function(d, n){ d.classList.toggle('on', n === idx); });
    var p = vid.play();
    if (p && p.catch) p.catch(function(){});
  }
  vid.addEventListener('ended', function(){ load(idx + 1); });
  vid.addEventListener('error', function(){ load(idx + 1); });
  vid.addEventListener('timeupdate', function(){
    if (vid.duration) bar.style.width = (vid.currentTime / vid.duration * 100) + '%';
  });

  /* ── the clock ── */
  var labelEl = document.getElementById('label');
  var clockEl = document.getElementById('clock');
  var subEl   = document.getElementById('sub');

  function tick(){
    var now   = new Date();
    var first = at(STAGES[0][0]);
    var last  = at(STAGES[STAGES.length - 1][1]);

    if (now < first){
      var ms = first - now;
      var h = Math.floor(ms / 3600000);
      var m = Math.floor(ms % 3600000 / 60000);
      var s = Math.floor(ms % 60000 / 1000);
      labelEl.textContent = 'Begins in';
      clockEl.innerHTML = h > 0
        ? h + '<span class="u">h</span>' + two(m) + '<span class="u">m</span>'
        : m + '<span class="u">m</span>' + two(s) + '<span class="u">s</span>';
      subEl.textContent = 'Saturday 1 August · Native, Manchester';
      return;
    }

    if (now >= last){
      labelEl.textContent = 'The quest is complete';
      clockEl.textContent = 'Well fought';
      subEl.textContent = 'Code Quest MMXXVI';
      return;
    }

    for (var i = 0; i < STAGES.length; i++){
      var a = at(STAGES[i][0]), b = at(STAGES[i][1]);
      if (now >= a && now < b){
        var left = b - now;
        var lm = Math.floor(left / 60000);
        var ls = Math.floor(left % 60000 / 1000);
        labelEl.textContent = 'Now · ' + STAGES[i][2];
        clockEl.innerHTML = lm + '<span class="u">m</span>' + two(ls) + '<span class="u">s</span>';
        subEl.textContent = STAGES[i + 1] ? 'Next · ' + STAGES[i + 1][2] : 'Last stage';
        return;
      }
    }
    labelEl.textContent = 'Between stages';
    clockEl.textContent = '--';
    subEl.textContent = 'Saturday 1 August · Native, Manchester';
  }

  /* ── room-display niceties ── */
  var fs = document.getElementById('fs');
  fs.addEventListener('click', function(){
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'f' || e.key === 'F') fs.click();
  });

  var hideT;
  function wake(){
    document.body.classList.add('showcursor');
    clearTimeout(hideT);
    hideT = setTimeout(function(){ document.body.classList.remove('showcursor'); }, 2600);
  }
  document.addEventListener('mousemove', wake);
  document.addEventListener('touchstart', wake);

  if ('wakeLock' in navigator){
    var relock = function(){
      navigator.wakeLock.request('screen').catch(function(){});
    };
    relock();
    document.addEventListener('visibilitychange', function(){
      if (document.visibilityState === 'visible') relock();
    });
  }

  load(0);
  tick();
  setInterval(tick, 1000);
})();
</script>
