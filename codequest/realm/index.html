<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0912">
<title>Code Quest · The Realm — Art Pass I</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0B0912;touch-action:none;
  font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}

#veil{position:fixed;inset:0;z-index:60;background:#0B0912;display:grid;place-items:center;
  transition:opacity .9s;text-align:center}
#veil.gone{opacity:0;pointer-events:none}
#veil h1{font-family:'Grenze Gotisch',serif;font-weight:800;font-size:clamp(34px,9vw,54px);
  color:#F2CE7B;margin:0;line-height:1}
#veil p{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.24em;
  text-transform:uppercase;color:#9A8F7A;margin-top:12px}

#strap{position:fixed;top:0;left:0;right:0;z-index:10;pointer-events:none;text-align:center;
  padding:calc(12px + env(safe-area-inset-top)) 14px 10px;
  background:linear-gradient(rgba(11,9,18,.9),rgba(11,9,18,0));
  font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;
  letter-spacing:.2em;text-transform:uppercase;color:#F2CE7B;text-shadow:0 2px 8px #000}
#strap span{color:#9A8F7A}

#label{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);opacity:0;
  bottom:calc(140px + env(safe-area-inset-bottom));z-index:12;transition:.2s;pointer-events:none;
  background:rgba(21,18,31,.92);border:1px solid rgba(217,169,76,.35);border-radius:99px;
  padding:11px 20px;font-size:14px;color:#E9DFC7;max-width:88vw;text-align:center}
#label.show{opacity:1;transform:translateX(-50%)}

#pad{position:fixed;left:calc(18px + env(safe-area-inset-left));bottom:calc(20px + env(safe-area-inset-bottom));
  width:112px;height:112px;border-radius:50%;z-index:15;
  background:radial-gradient(circle, rgba(233,223,199,.06), rgba(233,223,199,.02));
  border:1px solid rgba(233,223,199,.16)}
#nub{position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;
  transform:translate(-50%,-50%);background:rgba(217,169,76,.3);border:1px solid #D9A94C}
@media(hover:hover) and (pointer:fine){ #pad{display:none} }

#keys{position:fixed;left:0;right:0;bottom:12px;z-index:9;text-align:center;pointer-events:none;
  font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:#9A8F7A}
@media(hover:none){ #keys{display:none} }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="strap">Code Quest · The Realm <span>&middot; art pass II — exterior &amp; Guild Hall</span></div>
<div id="label"></div>

<div id="pad"><div id="nub"></div></div>
<div id="keys">Arrows or WASD to walk the realm</div>

<div id="veil">
  <div>
    <h1>The Realm</h1>
    <p>Art pass II &middot; walk, judge, approve</p>
  </div>
</div>

<script src="bundle.js"></script>
</body>
</html>
