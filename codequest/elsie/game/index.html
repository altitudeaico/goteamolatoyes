<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Butterfly Dash — by Elsie</title>
<meta property="og:title" content="Butterfly Dash — by Elsie">
<meta property="og:description" content="Three ways to play. Butterflii Art Studio. Code Quest 2026.">

<style>
  :root{
    --bg:#EDE6F9;
    --deep:#E2D6F5;
    --card:#FBF8FE;
    --line:rgba(58,42,92,.14);
    --lav:#8B6BD6;
    --lav-2:#6F4FBF;
    --text:#33224F;
    --dim:rgba(51,34,79,.55);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
  body{background:var(--bg);color:var(--text);font-family:"Inter",system-ui,sans-serif;display:flex;justify-content:center}
  .app{position:relative;width:100%;max-width:520px;height:100dvh;overflow:hidden;background:var(--bg)}
  canvas{display:block;width:100%;height:100%}

  /* ---------- HUD ---------- */
  .hud{
    position:absolute;top:0;left:0;right:0;z-index:2;pointer-events:none;
    padding:calc(env(safe-area-inset-top) + 14px) 18px 0;
    display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:10px;opacity:.9}
  .logo{width:30px;height:30px;object-fit:contain;display:block}
  .brand .name{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);font-weight:600;line-height:1.5}
  .brand .name b{display:block;color:var(--text);font-weight:600;letter-spacing:.22em}
  .right{text-align:right;font-family:"DM Mono",monospace;display:grid;gap:5px;justify-items:end}
  .score{font-size:30px;letter-spacing:-.03em;line-height:1}
  .lv{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--lav)}
  .combo{font-size:10px;letter-spacing:.14em;color:var(--dim);height:12px}
  .meta{display:flex;align-items:center;gap:8px}
  .chip{width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 10px currentColor}
  .hearts{display:flex;gap:4px}
  .heart{width:13px;height:11px;transition:opacity .3s,transform .3s}
  .heart.gone{opacity:.14;transform:scale(.7)}

  .sound{
    position:absolute;left:18px;bottom:calc(env(safe-area-inset-bottom) + 26px);z-index:6;
    width:48px;height:48px;border-radius:50%;border:1px solid var(--line);
    background:rgba(255,255,255,.66);backdrop-filter:blur(8px);
    display:grid;place-items:center;cursor:pointer;color:var(--lav-2);
    transition:transform .15s,color .2s,border-color .2s;
  }
  .musicPill{
    position:absolute;left:74px;bottom:calc(env(safe-area-inset-bottom) + 36px);z-index:6;
    font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;
    color:var(--text);background:rgba(255,255,255,.72);backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:99px;padding:8px 13px;pointer-events:none;
  }
  .sound:active{transform:scale(.93)}
  .sound.off{color:var(--dim)}
  .sound .slash{position:absolute;width:26px;height:1.5px;background:currentColor;transform:rotate(-45deg);opacity:0;transition:opacity .2s}
  .sound.off .slash{opacity:1}
  .bloom{
    position:absolute;right:20px;bottom:calc(env(safe-area-inset-bottom) + 26px);z-index:3;
    width:70px;height:70px;border-radius:50%;border:1px solid var(--line);
    background:rgba(255,255,255,.66);backdrop-filter:blur(8px);display:grid;place-items:center;cursor:pointer;
    font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:600;
    transition:transform .15s,box-shadow .25s,color .25s,border-color .25s;
  }
  .bloom .ring{position:absolute;inset:-1px}
  .bloom.ready{color:var(--text);border-color:var(--lav);box-shadow:0 0 0 5px rgba(139,107,214,.18)}
  .bloom:active{transform:scale(.93)}
  .hide{display:none!important}

  /* ---------- overlays ---------- */
  .veil{
    position:absolute;inset:0;z-index:4;
    background:linear-gradient(180deg,rgba(237,230,249,.96),rgba(226,214,245,.99));
    backdrop-filter:blur(10px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:14px;
    padding:calc(env(safe-area-inset-top) + 20px) 22px 100px;
    overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  }
  .mark{width:44px;height:44px;object-fit:contain;opacity:.95}
  h1{
    font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
    font-size:clamp(28px,8.5vw,40px);line-height:.94;letter-spacing:-.04em;
  }
  h1 em{font-style:normal;color:var(--lav)}
  .kicker{font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:var(--dim);font-weight:600}
  .tag{color:var(--dim);font-size:13.5px;line-height:1.6;max-width:32ch}
  .modes{display:grid;gap:9px;width:100%;max-width:340px}
  .mode{
    text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;
    padding:13px 15px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
    transition:transform .16s,border-color .25s,background .25s;
  }
  .mode:active{transform:scale(.985)}
  .mode:hover{border-color:var(--lav-2);background:#F3EDFD}
  .mode h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px;letter-spacing:-.01em}
  .mode p{font-size:11.5px;color:var(--dim);line-height:1.45;margin-top:4px;max-width:34ch}
  .mode .go{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--lav);font-weight:600}

  .picker{width:100%;max-width:340px}
  .pickerLabel{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:9px;text-align:left}
  .pickerLabel span{color:var(--lav);letter-spacing:.1em;text-transform:none}
  .avatars{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 8px;scrollbar-width:none}
  .avatars::-webkit-scrollbar{display:none}
  .av{
    position:relative;flex:0 0 auto;width:44px;height:50px;border-radius:12px;
    border:1px solid var(--line);background:#F1EAFC no-repeat center bottom;background-size:86% auto;
    cursor:pointer;transition:transform .16s,border-color .25s,box-shadow .25s;
  }
  .av.on{border-color:var(--lav);box-shadow:0 8px 22px -12px var(--lav-2);transform:translateY(-3px)}
  .av.locked{filter:grayscale(1) brightness(1.06);opacity:.45}
  .av .need{
    position:absolute;inset:auto 0 0 0;text-align:center;font-family:"DM Mono",monospace;
    font-size:8.5px;color:var(--text);background:rgba(51,34,79,.72);border-radius:0 0 11px 11px;padding:2px 0;
  }
  .btn{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;
    background:var(--lav);color:#fff;border:0;border-radius:99px;padding:15px 34px;cursor:pointer;
    transition:transform .15s,filter .2s;
  }
  .btn:active{transform:scale(.96)}
  .btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);padding:12px 22px}
  .final{font-family:"DM Mono",monospace;font-size:62px;line-height:1;letter-spacing:-.04em}
  .best{font-family:"DM Mono",monospace;font-size:11px;color:var(--lav);letter-spacing:.06em}
  .credit{font-size:8px;margin-top:2px;letter-spacing:.3em;text-transform:uppercase;color:rgba(51,34,79,.32)}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <canvas id="cv"></canvas>

  <div class="hud">
    <div class="brand">
      <img class="logo" id="logo" alt="">
      <div class="name"><b>Butterfly Dash</b><span id="modeLabel">Butterflii Art Studio</span></div>
    </div>
    <div class="right">
      <div class="score" id="score">0</div>
      <div class="lv" id="lv"></div>
      <div class="meta">
        <span class="chip hide" id="chip"></span>
        <span class="hearts" id="hearts"></span>
      </div>
      <div class="combo" id="combo"></div>
    </div>
  </div>

  <div class="musicPill" id="musicNote">Music: starting up</div>

  <button class="sound" id="soundBtn" aria-label="Music on or off">
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.6"/><circle cx="16.5" cy="16" r="2.6"/>
    </svg>
    <span class="slash" id="slash"></span>
  </button>

  <button class="bloom hide" id="bloomBtn" aria-label="Release bloom">
    <svg class="ring" viewBox="0 0 80 80"><circle id="ringArc" cx="40" cy="40" r="37" fill="none"
      stroke="#8B6BD6" stroke-width="3" stroke-linecap="round" stroke-dasharray="232" stroke-dashoffset="232"
      transform="rotate(-90 40 40)"/></svg>
    <span>Bloom</span>
  </button>

  <div class="veil" id="menuVeil">
    <img class="mark" id="mark" alt="">
    <div>
      <p class="kicker">Butterflii Art Studio</p>
      <h1 style="margin-top:10px">Butterfly <em>Dash</em></h1>
    </div>
    <div class="modes">
      <button class="mode" id="pickMaster">
        <span>
          <h2>Master</h2>
          <p>Run the city towards you. Three lanes, trains to dodge, colour gates. One train and you are out.</p>
        </span>
        <span class="go">Run</span>
      </button>
      <button class="mode" id="pickDraw">
        <span>
          <h2>Easy</h2>
          <p>Side view. Tap to jump and flip over spikes, holes and low ceilings. She paints the line.</p>
        </span>
        <span class="go">Draw</span>
      </button>
    </div>
    <div class="picker">
      <p class="pickerLabel">Character <span id="lockNote"></span></p>
      <div class="avatars" id="avatars"></div>
    </div>
    <div class="credit">Butterflii by Elsie</div>
  </div>

  <div class="veil hide" id="endVeil">
    <p class="kicker" id="cause">Run over</p>
    <div class="final" id="final">0</div>
    <p class="best" id="best"></p>
    <p class="tag" id="verdict"></p>
    <button class="btn" id="againBtn">Run again</button>
    <button class="btn ghost" id="menuBtn">Change mode</button>
  </div>
</div>

<script>
/* older browsers (iPad, Safari < 16) have no roundRect — without this the
   canvas draw calls throw and the game stops rendering */
if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r){
    if (typeof r === 'number') r = [r, r, r, r];
    if (!Array.isArray(r)) r = [4, 4, 4, 4];
    const rr = Math.min(Math.abs(r[0]), Math.abs(w)/2, Math.abs(h)/2);
    this.beginPath();
    this.moveTo(x + rr, y);
    this.arcTo(x + w, y,     x + w, y + h, rr);
    this.arcTo(x + w, y + h, x,     y + h, rr);
    this.arcTo(x,     y + h, x,     y,     rr);
    this.arcTo(x,     y,     x + w, y,     rr);
    this.closePath();
    return this;
  };
}

  function drawHearts(n){
    $('hearts').innerHTML = '';
    for(var i=0;i<3;i++){
      var d = document.createElement('span');
      d.className = 'heart' + (i<n ? '' : ' gone');

  function buildPicker(){

      ctx.beginPath(); ctx.ellipse(0,6,3.4,4.4,0,0,7); ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-8,-6); ctx.lineTo(-3,-1); ctx.moveTo(-3,-6); ctx.lineTo(-8,-1);
      ctx.moveTo(3,-6);  ctx.lineTo(8,-1);  ctx.moveTo(8,-6);  ctx.lineTo(3,-1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-5,6); ctx.quadraticCurveTo(-2,2,1,6); ctx.quadraticCurveTo(4,10,7,6); ctx.stroke();
    } else if(kind === 'star'){
      ctx.fillStyle = '#E39400';
      for(var s=0;s<2;s++){
        var sx = s ? 5 : -5;
        ctx.beginPath();
        for(var i=0;i<10;i++){
          var ang = -Math.PI/2 + i*Math.PI/5, rr = i%2 ? 1.5 : 3.8;
          if(i) ctx.lineTo(sx + Math.cos(ang)*rr, -3 + Math.sin(ang)*rr);
          else ctx.moveTo(sx + Math.cos(ang)*rr, -3 + Math.sin(ang)*rr);
        }
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = TEXT;
      ctx.beginPath(); ctx.arc(0,4,4.4,0.1*Math.PI,0.9*Math.PI); ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(-9,-6); ctx.lineTo(-2,-3); ctx.moveTo(9,-6); ctx.lineTo(2,-3); ctx.stroke();
      ctx.beginPath(); ctx.arc(-5,0,2.3,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(5,0,2.3,0,7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-4,6); ctx.lineTo(4,6); ctx.stroke();
    }
    ctx.restore();
  }

  function butterflyWings(c, flap, sc){
    var s;
    ctx.save();
    ctx.translate(0, -6*sc);
    for(s=-1; s<=1; s+=2){
      ctx.save();
      ctx.scale(s*flap, 1);

      var grd = ctx.createLinearGradient(0, -46*sc, 62*sc, 20*sc);
      grd.addColorStop(0, '#FFFFFF');
      grd.addColorStop(0.45, c);
      grd.addColorStop(1, '#E7D9FB');
      ctx.fillStyle = grd;
      ctx.strokeStyle = 'rgba(255,255,255,.75)';
      ctx.lineWidth = 1.5*sc;

      ctx.globalAlpha = 0.82;
      ctx.beginPath();
      ctx.moveTo(3*sc, -6*sc);
      ctx.bezierCurveTo(30*sc, -64*sc, 78*sc, -54*sc, 60*sc, -14*sc);
      ctx.bezierCurveTo(50*sc, 8*sc, 22*sc, 8*sc, 3*sc, -6*sc);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      ctx.globalAlpha = 0.68;
      ctx.beginPath();
      ctx.moveTo(3*sc, 0);
      ctx.bezierCurveTo(24*sc, 30*sc, 52*sc, 58*sc, 42*sc, 22*sc);
      ctx.bezierCurveTo(38*sc, 4*sc, 18*sc, -2*sc, 3*sc, 0);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      ctx.globalAlpha = 0.9;
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.beginPath(); ctx.arc(40*sc, -26*sc, 2.4*sc, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(50*sc, -14*sc, 1.7*sc, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(31*sc, 22*sc, 1.9*sc, 0, 7); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  /* hero: sc scales her for distance, turn tips her as she crosses lanes */
  function drawHero(x, y, c, blink, sc, turn, spin, anchorBottom){
    var img = imgs[picked];
    if(blink && Math.floor(performance.now()/90)%2) return;
    sc = sc || 1; turn = turn || 0; spin = spin || 0;
    var t = performance.now()/1000;
    var master = (mode === 'master');
    var base = master ? 132 : 64;
    var hgt = base*sc;
    if(!(img && img.complete && img.naturalWidth)) return;
    var wid = hgt * img.naturalWidth / img.naturalHeight;
    var cad = 8.2;
    var bounce = master ? Math.abs(Math.sin(t*cad))*7*sc : 0;
    var squash = master ? 1 - Math.abs(Math.cos(t*cad))*0.04 : 1;
    var bottomOff = anchorBottom ? 0 : (master ? hgt*0.5 : 18);

    // shadow on the road
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = 'rgba(58,42,92,.24)';
    ctx.beginPath(); ctx.ellipse(0, bottomOff - 2, wid*0.36, 8*sc, 0, 0, 7); ctx.fill();
    ctx.fillStyle = c; ctx.globalAlpha = .3;
    ctx.beginPath(); ctx.ellipse(0, bottomOff - 2, wid*0.30, 6*sc, 0, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();

    if(master){
      // dust off her heels
      ctx.save(); ctx.translate(x, y);
      for(var d=0; d<3; d++){
        var ph = ((t*2.4) + d/3) % 1;
        ctx.globalAlpha = (1-ph)*0.22;
        ctx.fillStyle = '#8B6BD6';
        ctx.beginPath(); ctx.arc((d%2?1:-1)*(10+ph*26)*sc, bottomOff - 4 - ph*16*sc, (3+ph*7)*sc, 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1; ctx.restore();
    }

    ctx.save();
    ctx.translate(x, y - bounce + bottomOff - hgt/2);
    ctx.rotate(spin + turn*0.34);
    ctx.scale((1 - Math.abs(turn)*0.42) , squash);   // she turns as she cuts across

    var flyer = !!(ROSTER[picked] && ROSTER[picked].wings);
    if(flyer || !master){
      var flap = Math.sin(performance.now()/(flyer ? 130 : 160))*0.22 + 0.88;
      butterflyWings(c, flap, hgt/104);
      ctx.globalAlpha = 1;
    }

    ctx.shadowColor = 'rgba(58,42,92,.35)'; ctx.shadowBlur = 16*sc; ctx.shadowOffsetY = 6*sc;
    ctx.drawImage(img, -wid/2, -hgt/2, wid, hgt);
    ctx.restore();

    if(G.faceT > 0){
      drawFace(x + wid*0.60, y - bounce + bottomOff - hgt - 8*sc, G.faceType || 'happy',
               Math.min(1, G.faceT/0.35), Math.max(0.7, sc));
    }
  }

  /* ================= MASTER: forward city run ================= */
  var MM = {
    sc: function(t){ return Math.pow(1 - Math.min(1,Math.max(0,t)), 2) * 0.94 + 0.06; },
    ys: function(t){ return HORIZON + (PLAYY - HORIZON) * MM.sc(t); },
    xs: function(laneF, t){ return W*0.5 + (laneF - 1) * LANEW * MM.sc(t); },

    start: function(){
      G.t=0; G.dist=0; G.spd=0.40; G.lane=1; G.laneF=1; G.turn=0;
      G.ents=[]; G.queue=[]; G.hearts=3; G.score=0; G.paint=PAINTS[0];
      G.charge=0; G.invuln=0; G.combo=0; G.spawnIn=0.7; G.flash=0; G.shake=0;
      G.level=1; G.levelFlash=0; G.faceT=0; G.swapFlash=0;
      $('lv').textContent = 'Level 1';
      drawHearts(3); updateBloom();
    },
    move: function(d){ G.lane = Math.min(2, Math.max(0, G.lane + d)); },
    train: function(l){ G.ents.push({k:'train', lane:l, t:1, len:0.30}); },
    drop:  function(l,c){ G.ents.push({k:'drop', lane:l, t:1, c:c}); },
    gate:  function(l,c){ G.ents.push({k:'gate', lane:l, t:1, c:c}); },
    coins: function(l,n){ for(var i=0;i<n;i++) G.ents.push({k:'coin', lane:l, t:1 + i*0.075}); },

    schedule: function(){
      var r = Math.random();
      var pick = function(){ return (Math.random()*3)|0; };
      var paint = function(){ return PAINTS[(Math.random()*PAINTS.length)|0]; };

      // one hazard at a time, always a single lane, never a diagonal run
      if(r < 0.30){
        MM.coins(pick(), 5);
      } else if(r < 0.58){
        var c = paint(), gl = pick();
        MM.drop(pick(), c);
        G.queue.push({ in:1.25, fn:function(){ MM.gate(gl, c); }});
      } else if(r < 0.86){
        var b = pick();
        MM.train(b);
        if(Math.random() < 0.6) MM.drop((b + 1 + ((Math.random()*2)|0)) % 3, paint());
      } else {
        MM.drop(pick(), paint());
      }

      G.spawnIn = Math.max(0.95, 1.6 - G.level*0.04);
    },

    bloom: function(){
      if(G.charge < 5) return;
      G.charge = 0; G.invuln = 1.4; G.flash = 1; react('star', 1.4);
      var cleared = 0;
      G.ents = G.ents.filter(function(e){
        if(e.k === 'drop' || e.k === 'coin') return true;
        cleared++; return false;
      });
      G.score += cleared*60; updateBloom();
    },
    hurt: function(){
      if(G.invuln > 0) return;
      G.hearts--; G.combo = 0; G.invuln = 1.1; G.shake = 1; react('ouch', 1.2);
      drawHearts(G.hearts);
      if(navigator.vibrate) navigator.vibrate(40);
      if(G.hearts <= 0) end('She ran out of hearts');
    },

    step: function(dt){
      var i, e;
      G.t += dt;
      var lv = 1 + Math.floor(G.dist/170);
      if(lv !== G.level){
        G.level = lv; G.levelFlash = 1.6; react('focus', 1.2);
        $('lv').textContent = 'Level ' + lv;
        musicSpeed(lv);
        G.score += 150;
        if(G.hearts < 3 && lv % 3 === 0){ G.hearts++; drawHearts(G.hearts); }
      }
      G.spd = Math.min(1.35, 0.40 + G.level*0.075);
      G.dist += G.spd*dt*60;
      G.score += G.spd*dt*34*(1 + G.level*0.05);
      if(G.invuln > 0) G.invuln -= dt;
      if(G.flash > 0) G.flash -= dt*2.2;
      if(G.shake > 0) G.shake -= dt*3;
      if(G.levelFlash > 0) G.levelFlash -= dt;
      if(G.faceT > 0) G.faceT -= dt;
      if(G.swapFlash > 0) G.swapFlash -= dt;

      for(i=0;i<G.queue.length;i++) G.queue[i].in -= dt;
      G.queue = G.queue.filter(function(q){ if(q.in <= 0){ q.fn(); return false; } return true; });
      G.spawnIn -= dt;
      if(G.spawnIn <= 0) MM.schedule();

      var prevLaneF = G.laneF;
      G.laneF += (G.lane - G.laneF) * Math.min(1, dt*16);
      G.turn = Math.max(-1, Math.min(1, (G.laneF - prevLaneF)/(dt*9 || 1)));

      for(i=0;i<G.ents.length;i++){
        e = G.ents[i];
        e.t -= G.spd*dt;
        var reach = (e.k === 'train') ? 0.26 : 0.58;      // tight box on the train, generous on pickups
        if(!e.hit && e.t < 0.05 && e.t > -0.07 && Math.abs(e.lane - G.laneF) < reach){
          if(e.k === 'coin'){
            e.hit = true; G.score += 45; G.combo++;
            if(G.combo % 5 === 0) react('happy', 0.7);
          } else if(e.k === 'drop'){
            e.hit = true; G.paint = e.c; G.combo++; G.score += 60 + G.combo*8;
            G.charge = Math.min(5, G.charge+1); updateBloom(); react('happy', 0.8);
          } else if(e.k === 'gate'){
            e.hit = true;
            if(e.c === G.paint){ G.score += 220; G.combo++; react('wow', 0.9); }
            else { MM.hurt(); if(!running) return; }
          } else {
            e.hit = true; react('ouch', 1.2);
            if(navigator.vibrate) navigator.vibrate([40,60,40]);
            end('She hit a train');
            return;
          }
        }
      }
      G.ents = G.ents.filter(function(en){ return en.t > -0.12 && !(en.hit && en.k !== 'gate'); });

      checkAvatarUp();
      $('score').textContent = Math.floor(G.score);
      $('combo').textContent = G.combo > 2 ? ('streak ' + G.combo) : '';
      $('chip').classList.remove('hide');
      $('chip').style.background = G.paint;
      $('chip').style.color = G.paint;
    },

    scene: function(){
      // sky
      var g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'#F3ECFD'); g.addColorStop(0.33,'#DFCFF6'); g.addColorStop(0.36,'#D5C4F0'); g.addColorStop(1,'#E9E0F8');
      ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

      // far skyline sitting on the horizon
      var d = G.dist*0.6, step = 46;
      ctx.fillStyle = '#CDB8EC';
      var s0 = Math.floor(d/step), sh = d - s0*step;
      for(var i=-1; i*step - sh < W + step; i++){
        var idx = s0 + i;
        var n = Math.abs(Math.sin(idx*12.9898)*43758.5453) % 1;
        var hgt = 26 + n*86;
        ctx.fillRect(i*step - sh, HORIZON - hgt, step - 6, hgt);
      }
      ctx.fillStyle = 'rgba(111,79,191,.28)';
      ctx.fillRect(0, HORIZON - 1, W, 2);

      // the road running away from you
      var bl = MM.xs(-0.85, 0), br = MM.xs(2.85, 0);
      var tl = MM.xs(-0.85, 1), tr = MM.xs(2.85, 1);
      var rg = ctx.createLinearGradient(0, HORIZON, 0, H);
      rg.addColorStop(0,'#D9C9F1'); rg.addColorStop(1,'#C9B4E9');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.moveTo(tl, MM.ys(1)); ctx.lineTo(tr, MM.ys(1));
      ctx.lineTo(br, H); ctx.lineTo(bl, H); ctx.closePath(); ctx.fill();

      // lane rails, dashed and rushing towards you
      var scroll = (G.dist*0.02) % 1;
      for(var k=0;k<2;k++){
        var lane = k === 0 ? -0.02 : 1.98;
        for(var s=0;s<16;s++){
          var t0 = ((s/16) + scroll) % 1;
          var t1 = t0 - 0.028;
          if(t1 < 0) continue;
          var a0 = MM.sc(t0), a1 = MM.sc(t1);
          ctx.fillStyle = 'rgba(255,255,255,' + (0.25 + a0*0.55) + ')';
          ctx.beginPath();
          ctx.moveTo(MM.xs(lane, t0) - 2*a0, MM.ys(t0));
          ctx.lineTo(MM.xs(lane, t0) + 2*a0, MM.ys(t0));
          ctx.lineTo(MM.xs(lane, t1) + 2.6*a1, MM.ys(t1));
          ctx.lineTo(MM.xs(lane, t1) - 2.6*a1, MM.ys(t1));
          ctx.closePath(); ctx.fill();
        }
      }

      // buildings sliding past on both sides
      var bs = (G.dist*0.014) % 1;
      for(var b=0;b<9;b++){
        var t = 1 - (((b/9) + bs) % 1);
        var sc = MM.sc(t), y = MM.ys(t);
        var bh = 300*sc, bw = 92*sc;
        var shade = 0.10 + sc*0.18;
        for(var side=-1; side<=1; side+=2){
          var bx = MM.xs(side < 0 ? -1.35 : 3.35, t);
          ctx.fillStyle = 'rgba(120,88,190,' + (shade*1.5).toFixed(3) + ')';
          ctx.fillRect(bx - bw/2, y - bh, bw, bh);
          ctx.fillStyle = 'rgba(255,255,255,' + (sc*0.5).toFixed(3) + ')';
          for(var wy = y - bh + 14*sc; wy < y - 16*sc; wy += 26*sc){
            for(var wx = bx - bw/2 + 10*sc; wx < bx + bw/2 - 12*sc; wx += 22*sc){
              if((Math.abs(Math.sin((wx*3.7 + wy*1.9 + b))) % 1) > 0.55) ctx.fillRect(wx, wy, 7*sc, 10*sc);
            }
          }
        }
      }
    },

    render: function(){
      ctx.save();
      if(G.shake > 0) ctx.translate((Math.random()-0.5)*9*G.shake, (Math.random()-0.5)*9*G.shake);
      MM.scene();

      var list = G.ents.slice().sort(function(a,b){ return b.t - a.t; });
      for(var i=0;i<list.length;i++){
        var e = list[i];
        if(e.t > 1.02 || e.t < -0.12) continue;
        var sc = MM.sc(e.t), x = MM.xs(e.lane, e.t), y = MM.ys(e.t);
        if(e.k === 'train'){
          // the whole carriage, running back towards the horizon
          var t0 = Math.max(e.t, -0.05), t1 = Math.min(1.02, e.t + e.len);
          var s0 = MM.sc(t0), s1 = MM.sc(t1);
          var c0 = MM.xs(e.lane, t0), c1 = MM.xs(e.lane, t1);
          var y0 = MM.ys(t0), y1 = MM.ys(t1);
          var hw0 = 46*s0, hw1 = 46*s1, bh0 = 116*s0, bh1 = 116*s1;
          var l0 = c0 - hw0, r0 = c0 + hw0, top0 = y0 - bh0;
          var l1 = c1 - hw1, r1 = c1 + hw1, top1 = y1 - bh1;

          ctx.save();
          // shadow along its length
          ctx.fillStyle = 'rgba(58,42,92,.26)';
          ctx.beginPath();
          ctx.moveTo(l0, y0); ctx.lineTo(r0, y0); ctx.lineTo(r1, y1); ctx.lineTo(l1, y1);
          ctx.closePath(); ctx.fill();

          // far end
          ctx.fillStyle = '#2E2050';
          ctx.beginPath(); ctx.rect(l1, top1, r1 - l1, bh1); ctx.fill();

          // the two long sides
          function side(xa, xb, shade){
            ctx.fillStyle = shade;
            ctx.beginPath();
            ctx.moveTo(xa, top0); ctx.lineTo(xa, y0);
            ctx.lineTo(xb, y1);   ctx.lineTo(xb, top1);
            ctx.closePath(); ctx.fill();
          }
          side(l0, l1, '#3D2A66');
          side(r0, r1, '#553C86');

          // windows running down the side
          for(var k=0;k<5;k++){
            var ta = t0 + (t1-t0)*(0.10 + k*0.17);
            var tb = ta + (t1-t0)*0.11;
            if(tb > t1) break;
            var sa = MM.sc(ta), sb = MM.sc(tb);
            var xa2 = MM.xs(e.lane, ta), xb2 = MM.xs(e.lane, tb);
            var ya = MM.ys(ta), yb = MM.ys(tb);
            ctx.fillStyle = 'rgba(233,220,251,.7)';
            for(var sd=-1; sd<=1; sd+=2){
              ctx.beginPath();
              ctx.moveTo(xa2 + sd*46*sa, ya - 116*sa + 26*sa);
              ctx.lineTo(xa2 + sd*46*sa, ya - 116*sa + 66*sa);
              ctx.lineTo(xb2 + sd*46*sb, yb - 116*sb + 66*sb);
              ctx.lineTo(xb2 + sd*46*sb, yb - 116*sb + 26*sb);
              ctx.closePath(); ctx.fill();
            }
          }

          // roof
          ctx.fillStyle = '#6A4EA3';
          ctx.beginPath();
          ctx.moveTo(l0, top0); ctx.lineTo(r0, top0); ctx.lineTo(r1, top1); ctx.lineTo(l1, top1);
          ctx.closePath(); ctx.fill();

          // the back of it, the bit you actually run into
          ctx.fillStyle = '#4A3372';
          ctx.beginPath(); ctx.roundRect(l0, top0, r0 - l0, bh0, 8*s0); ctx.fill();
          ctx.fillStyle = 'rgba(233,220,251,.88)';
          ctx.beginPath(); ctx.roundRect(l0 + 11*s0, top0 + 24*s0, (r0-l0) - 22*s0, 42*s0, 6*s0); ctx.fill();
          ctx.fillStyle = 'rgba(122,88,190,.3)';
          ctx.fillRect(l0 + 11*s0, top0 + 24*s0, (r0-l0) - 22*s0, 13*s0);
          ctx.fillStyle = '#FF4FA3';
          ctx.beginPath(); ctx.roundRect(l0 + 10*s0, top0 + 78*s0, 18*s0, 12*s0, 3*s0); ctx.fill();
          ctx.beginPath(); ctx.roundRect(r0 - 28*s0, top0 + 78*s0, 18*s0, 12*s0, 3*s0); ctx.fill();
          ctx.fillStyle = '#241A40';
          ctx.fillRect(l0 + 4*s0, y0 - 12*s0, (r0-l0) - 8*s0, 9*s0);
          ctx.restore();
        } else if(e.k === 'coin'){        } else if(e.k === 'coin'){        } else if(e.k === 'coin'){
          if(e.hit) continue;
          ctx.fillStyle = '#7C4DD0';
          ctx.beginPath(); ctx.arc(x, y - 26*sc, 9*sc, 0, 7); ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,.6)';
          ctx.beginPath(); ctx.arc(x - 2.6*sc, y - 28.6*sc, 2.8*sc, 0, 7); ctx.fill();
        } else if(e.k === 'drop'){
          if(e.hit) continue;
          ctx.save();
          ctx.shadowColor = e.c; ctx.shadowBlur = 22*sc;
          ctx.fillStyle = e.c;
          ctx.beginPath(); ctx.ellipse(x, y - 30*sc, 13*sc, 15*sc, 0, 0, 7); ctx.fill();
          ctx.restore();
        } else if(e.k === 'gate'){
          ctx.save();
          ctx.globalAlpha = e.hit ? 0.25 : 0.92;
          ctx.shadowColor = e.c; ctx.shadowBlur = 26*sc;
          ctx.fillStyle = e.c;
          ctx.fillRect(x - 9*sc, y - 118*sc, 18*sc, 118*sc);
          ctx.globalAlpha = e.hit ? 0.1 : 0.22;
          ctx.fillRect(x - 44*sc, y - 118*sc, 88*sc, 118*sc);
          ctx.restore();
        }
      }

      drawHero(MM.xs(G.laneF, 0), PLAYY, G.paint, G.invuln > 0, 1, G.turn, 0, false);
      drawBanner();

      if(G.levelFlash > 0){
        var a = Math.min(1, G.levelFlash/0.5);
        ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center';
        ctx.fillStyle = '#6F4FBF';
        ctx.font = '800 34px "Bricolage Grotesque", sans-serif';
        ctx.fillText('LEVEL ' + G.level, W/2, H*0.26);
        ctx.restore();
      }
      if(G.flash > 0){
        ctx.fillStyle = 'rgba(255,255,255,' + (G.flash*0.6) + ')';
        ctx.fillRect(0,0,W,H);
      }
      ctx.restore();
    }
  };

  /* ================= EASY: side view, she paints the line ================= */
  var DM = {
    g: 2500, jump: -790,
    start: function(){
      G.dist=0; G.v=380; G.vy=0; G.onGround=true; G.jumps=0;
      G.obs=[]; G.trail=[]; G.score=0; G.paint=PAINTS[0]; G.charge=0;
      G.nextAt=560; G.spinT=0; G.faceT=0; G.swapFlash=0;
      G.x = W*0.26; G.y = groundY - 18;
      $('hearts').innerHTML = ''; $('lv').textContent = ''; $('combo').textContent = '';
      $('chip').classList.add('hide');
    },
    tap: function(){
      if(G.jumps < 2){
        G.vy = DM.jump * (G.jumps ? 0.82 : 1); G.jumps++; G.onGround = false;
        G.spinT = 0.42;
        if(G.jumps === 2) react('wow', 0.6);
      }
    },
    spawn: function(){
      var air = 2*Math.abs(DM.jump)/DM.g, reach = air*G.v;
      var x = W + 60, r = Math.random(), lvl = Math.floor(G.dist/2600), i, n, h2;
      if(r < 0.24){
        n = 1 + ((Math.random()*3)|0);
        for(i=0;i<n;i++) G.obs.push({t:'spike', x:x + i*34, w:30, h:32});
        G.nextAt = reach*0.8 + n*34 + Math.random()*90;
      } else if(r < 0.42){
        h2 = 54 + ((Math.random()*3)|0)*22;
        G.obs.push({t:'block', x:x, w:74, h:h2});
        if(Math.random() < 0.45) G.obs.push({t:'spike', x:x+130, w:30, h:32});
        G.nextAt = reach*0.95 + Math.random()*120;
      } else if(r < 0.58 && lvl >= 1){
        var pw = Math.min(reach*0.42, 130 + Math.random()*55);
        G.obs.push({t:'pit', x:x, w:pw});
        G.nextAt = pw + reach*0.55 + Math.random()*90;
      } else if(r < 0.72 && lvl >= 1){
        G.obs.push({t:'hang', x:x, w:110 + Math.random()*70});
        G.nextAt = reach*0.75 + Math.random()*110;
      } else if(r < 0.79 && lvl >= 2){
        G.obs.push({t:'blob', x:x, r:13, extra:15 + Math.random()*20});
        G.nextAt = reach*1.2 + Math.random()*140;
      } else {
        G.obs.push({t:'block', x:x, w:60, h:56});
        G.obs.push({t:'spike', x:x+92, w:30, h:32});
        G.obs.push({t:'block', x:x+152, w:60, h:56});
        G.nextAt = reach*1.2 + Math.random()*120;
      }
      G.nextAt = Math.max(G.nextAt, reach*0.78);

      if(Math.random() < 0.45){
        G.obs.push({t:'drop', x:x + reach*0.42, y:groundY - 74 - Math.random()*72,
                    c:PAINTS[(Math.random()*PAINTS.length)|0]});
      }
    },
    step: function(dt){
      var i, o, top, floor;
      G.v = Math.min(720, 380 + G.dist*0.011);
      G.dist += G.v*dt;
      G.score += G.v*dt*0.05;
      if(G.spinT > 0) G.spinT -= dt;
      if(G.faceT > 0) G.faceT -= dt;
      if(G.swapFlash > 0) G.swapFlash -= dt;

      G.vy += DM.g*dt;
      G.y += G.vy*dt;

      var overPit = false;
      for(i=0;i<G.obs.length;i++){
        o = G.obs[i];
        if(o.t === 'pit' && G.x > o.x + 8 && G.x < o.x + o.w - 8) overPit = true;
      }
      floor = overPit ? 100000 : groundY - 18;
      for(i=0;i<G.obs.length;i++){
        o = G.obs[i];
        if(o.t === 'block' && G.x+14 > o.x && G.x-14 < o.x+o.w){
          top = groundY - o.h - 18;
          if(G.vy >= 0 && G.y <= top + 24) floor = Math.min(floor, top);
        }
      }
      if(G.y >= floor){ G.y = floor; G.vy = 0; G.jumps = 0; G.onGround = true; }
      else G.onGround = false;
      if(G.y > H + 60){ end('She fell through'); return; }

      G.trail.push({x:G.x, y:G.y+16, c:G.paint});
      if(G.trail.length > 700) G.trail.shift();
      for(i=0;i<G.trail.length;i++) G.trail[i].x -= G.v*dt;

      G.nextAt -= G.v*dt;
      if(G.nextAt <= 0) DM.spawn();
      for(i=0;i<G.obs.length;i++) G.obs[i].x -= (G.v + (G.obs[i].extra || 0))*dt;
      G.obs = G.obs.filter(function(ob){ return ob.x + (ob.w || 60) > -180 && !ob.hit; });

      for(i=0;i<G.obs.length;i++){
        o = G.obs[i];
        if(o.t === 'spike'){
          if(G.x+11 > o.x+5 && G.x-11 < o.x+o.w-5 && G.y+16 > groundY - o.h + 8){ end('She hit a spike'); return; }
        } else if(o.t === 'block'){
          top = groundY - o.h - 18;
          if(G.x+12 > o.x && G.x-12 < o.x+o.w && G.y > top + 18){ end('She hit the wall'); return; }
        } else if(o.t === 'hang'){
          if(G.x+12 > o.x && G.x-12 < o.x+o.w && G.y - 16 < groundY - 96){ end('She hit the ceiling'); return; }
        } else if(o.t === 'blob'){
          if(Math.abs(G.x - o.x) < o.r + 7 && G.y + 16 > groundY - o.r*2 + 12){ end('The blob got her'); return; }
        } else if(o.t === 'drop'){
          if(Math.abs(G.x - o.x) < 25 && Math.abs(G.y - o.y) < 27){
            o.hit = true; G.paint = o.c; G.score += 140; react('happy', 0.8);
          }
        } else if((o.t === 'spike' || o.t === 'blob') && !o.warned && Math.abs(o.x - G.x) < 130){
          o.warned = true; if(G.faceT <= 0) react('focus', 0.7);
        }
      }
      checkAvatarUp();
      $('score').textContent = Math.floor(G.score);
    },
    render: function(){
      var i, o;
      var g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'#F4EEFD'); g.addColorStop(0.7,'#E7DCF8'); g.addColorStop(1,'#DED0F3');
      ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

      // a faint city behind the studio floor
      var d = G.dist*0.12, step = 58;
      ctx.fillStyle = 'rgba(120,88,190,.16)';
      var s0 = Math.floor(d/step), sh = d - s0*step;
      for(i=-1; i*step - sh < W + step; i++){
        var n = Math.abs(Math.sin((s0+i)*12.9898)*43758.5453) % 1;
        ctx.fillRect(i*step - sh, groundY - 60 - n*150, step - 8, 60 + n*150);
      }

      var gaps = [];
      for(i=0;i<G.obs.length;i++){ o = G.obs[i]; if(o.t === 'pit') gaps.push([o.x, o.x + o.w]); }
      gaps.sort(function(a,b){ return a[0]-b[0]; });
      var cur = -40;
      function slab(a,b){
        if(b <= a) return;
        ctx.fillStyle = '#CDB8EC'; ctx.fillRect(a, groundY, b-a, H-groundY);
        ctx.fillStyle = 'rgba(111,79,191,.55)'; ctx.fillRect(a, groundY - 1.5, b-a, 1.5);
      }
      for(i=0;i<gaps.length;i++){ slab(cur, gaps[i][0]); cur = Math.max(cur, gaps[i][1]); }
      slab(cur, W + 40);

      // the line she paints, glowing
      ctx.save();
      ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.shadowBlur = 14;
      for(i=1;i<G.trail.length;i++){
        var a = G.trail[i-1], b = G.trail[i];
        if(b.x < -30) continue;
        ctx.globalAlpha = Math.max(0.12, Math.min(1, b.x/(W*0.9)));
        ctx.strokeStyle = b.c; ctx.shadowColor = b.c;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      }
      ctx.restore();

      for(i=0;i<G.obs.length;i++){
        o = G.obs[i];
        if(o.t === 'spike'){
          ctx.fillStyle = '#4A3372'; ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(o.x, groundY); ctx.lineTo(o.x + o.w/2, groundY - o.h); ctx.lineTo(o.x + o.w, groundY);
          ctx.closePath(); ctx.fill(); ctx.stroke();
        } else if(o.t === 'block'){
          ctx.fillStyle = '#4A3372';
          ctx.beginPath(); ctx.roundRect(o.x, groundY - o.h, o.w, o.h, 6); ctx.fill();
          ctx.fillStyle = G.paint;
          ctx.fillRect(o.x + 9, groundY - o.h + 6, o.w - 18, 3);
        } else if(o.t === 'hang'){
          ctx.fillStyle = '#4A3372';
          ctx.beginPath(); ctx.roundRect(o.x, 0, o.w, groundY - 130, 5); ctx.fill();
          var nn = Math.floor(o.w/26);
          for(var k=0;k<nn;k++){
            var sx = o.x + k*26 + 3;
            ctx.beginPath();
            ctx.moveTo(sx, groundY - 130); ctx.lineTo(sx + 10, groundY - 96); ctx.lineTo(sx + 20, groundY - 130);
            ctx.closePath(); ctx.fill();
          }
        } else if(o.t === 'blob'){
          ctx.fillStyle = '#4A3372';
          ctx.beginPath(); ctx.arc(o.x, groundY - o.r, o.r, 0, 7); ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
        } else if(o.t === 'drop'){
          ctx.save(); ctx.shadowColor = o.c; ctx.shadowBlur = 18; ctx.fillStyle = o.c;
          ctx.beginPath(); ctx.ellipse(o.x, o.y, 12, 14, 0, 0, 7); ctx.fill();
          ctx.restore();
        }
      }

      var spin = G.spinT > 0 ? (1 - G.spinT/0.42)*Math.PI*2 : 0;
      drawHero(G.x, G.y, G.paint, false, 1, 0, spin, false);
      drawBanner();
    }
  };

  /* ---------------- music: rendered once, then looped as real audio ---------------- */
  var AUD = { on:true, el:null, built:false, building:false };
  var CHORDS = [
    [146.83, 174.61, 220.00],   // Dm
    [116.54, 174.61, 233.08],   // Bb
    [174.61, 220.00, 261.63],   // F
    [130.81, 196.00, 261.63]    // C
  ];

  function b64(bytes){
    var bin = '', chunk = 0x8000;
    for(var i=0;i<bytes.length;i+=chunk){
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
    }
    return btoa(bin);
  }

  function encodeWav(buf){
    var n = buf.length, d = buf.getChannelData(0);
    var ab = new ArrayBuffer(44 + n*2), v = new DataView(ab), i;
    function str(off, s){ for(var k=0;k<s.length;k++) v.setUint8(off+k, s.charCodeAt(k)); }
    str(0,'RIFF'); v.setUint32(4, 36 + n*2, true); str(8,'WAVE');
    str(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24, buf.sampleRate, true); v.setUint32(28, buf.sampleRate*2, true);
    v.setUint16(32,2,true); v.setUint16(34,16,true);
    str(36,'data'); v.setUint32(40, n*2, true);
    for(i=0;i<n;i++){
      var s = Math.max(-1, Math.min(1, d[i]));
      v.setInt16(44 + i*2, s < 0 ? s*0x8000 : s*0x7FFF, true);
    }
    return 'data:audio/wav;base64,' + b64(new Uint8Array(ab));
  }

  function buildMusic(){
    if(AUD.built || AUD.building) return;
    var OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if(!OAC) return;
    AUD.building = true;

    var sr = 22050, bpm = 100, eighth = 60/bpm/2;
    var steps = 32, len = Math.ceil(steps*eighth*sr) + sr*0.4;
    var oc = new OAC(1, len, sr);
    var bus = oc.createGain(); bus.gain.value = 0.9; bus.connect(oc.destination);

    var noise = oc.createBuffer(1, Math.floor(sr*0.2), sr);
    var nd = noise.getChannelData(0);
    for(var q=0;q<nd.length;q++) nd[q] = Math.random()*2 - 1;

    function tone(f, t, dur, type, vol, glide){
      var o = oc.createOscillator(), g = oc.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if(glide) o.frequency.exponentialRampToValueAtTime(glide, t + dur*0.9);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.014);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + 0.05);
    }
    function hat(t, vol){
      var s = oc.createBufferSource(), g = oc.createGain(), f = oc.createBiquadFilter();
      s.buffer = noise; f.type = 'highpass'; f.frequency.value = 6500;
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.055);
      s.connect(f); f.connect(g); g.connect(bus); s.start(t); s.stop(t + 0.07);
    }
    function pad(ch, t, dur){
      for(var i=0;i<ch.length;i++){
        var o = oc.createOscillator(), g = oc.createGain(), f = oc.createBiquadFilter();
        o.type = 'sawtooth'; o.frequency.value = ch[i]; o.detune.value = (i-1)*7;
        f.type = 'lowpass'; f.frequency.value = 1100;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.05, t + 0.3);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(f); f.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + 0.1);
      }
    }

    for(var s=0; s<steps; s++){
      var t = s*eighth, bar = (s >> 3) & 3, beat = s % 8, ch = CHORDS[bar];
      if(beat === 0){ pad(ch, t, eighth*8); tone(ch[0]/2, t, 0.45, 'triangle', 0.20); }
      if(beat === 0 || beat === 4) tone(125, t, 0.17, 'sine', 0.62, 46);
      if(beat === 6) tone(ch[0]/2, t, 0.32, 'triangle', 0.16);
      if(beat % 2 === 0) hat(t, 0.055); else hat(t, 0.02);
      tone(ch[(s + bar) % 3]*2, t, 0.24, 'triangle', beat % 2 ? 0.035 : 0.055);
      if(s === steps-1) tone(ch[2]*2, t, 0.3, 'sine', 0.05);
    }

    oc.startRendering().then(function(rendered){
      var el = document.createElement('audio');
      el.src = encodeWav(rendered);
      el.loop = true; el.volume = 0.55; el.setAttribute('playsinline','');
      document.body.appendChild(el);
      AUD.el = el; AUD.built = true; AUD.building = false;
      note('ready, tap to play');
      if(AUD.on && AUD.wanted) tryPlay();
    }).catch(function(){ AUD.building = false; note('could not build'); liveFallback(); });
  }

  function note(s){ var n = $('musicNote'); if(n) n.textContent = 'Music: ' + s; }

  function tryPlay(){
    if(!AUD.el) return;
    var pr = AUD.el.play();
    if(pr && pr.then){
      pr.then(function(){ note('playing'); AUD.fails = 0; })
        .catch(function(){
          AUD.fails = (AUD.fails||0) + 1;
          note('trying another way');
          liveFallback();
        });
    }
  }

  // last resort: play it live through the audio engine instead of as a file
  function liveFallback(){
    if(AUD.live) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) { note('this window blocks sound'); return; }
    var c = new AC();
    if(c.state === 'suspended'){
      c.resume().then(function(){ note('playing (live)'); })
               .catch(function(){ note('this window blocks sound'); });
    }
    var bus = c.createGain(); bus.gain.value = 0.4; bus.connect(c.destination);
    AUD.live = { c:c, bus:bus, step:0, next:c.currentTime + 0.1 };
    setInterval(function(){
      var L = AUD.live, e = 0.3;
      if(!L || !AUD.on) return;
      while(L.next < L.c.currentTime + 0.25){
        var s = L.step, bar = (s >> 3) & 3, beat = s % 8, ch = CHORDS[bar], t = L.next;
        function tn(f, dur, type, vol, glide){
          var o = L.c.createOscillator(), g = L.c.createGain();
          o.type = type; o.frequency.setValueAtTime(f, t);
          if(glide) o.frequency.exponentialRampToValueAtTime(glide, t + dur*0.9);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(vol, t + 0.014);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          o.connect(g); g.connect(L.bus); o.start(t); o.stop(t + dur + 0.05);
        }
        if(beat === 0) tn(ch[0]/2, 0.45, 'triangle', 0.2);
        if(beat === 0 || beat === 4) tn(125, 0.17, 'sine', 0.6, 46);
        tn(ch[(s + bar) % 3]*2, 0.24, 'triangle', beat % 2 ? 0.035 : 0.055);
        L.step = (L.step + 1) % 32;
        L.next += e;
      }
    }, 30);
    setTimeout(function(){
      note(AUD.live && AUD.live.c.state === 'running' ? 'playing (live)' : 'this window blocks sound');
    }, 400);
  }

  function musicPlay(){
    AUD.wanted = true;
    if(!AUD.built){ buildMusic(); note('still building'); return; }
    if(AUD.on) tryPlay();
  }

  // phones only allow sound that starts inside a real tap, so unlock on the first one
  function unlockAudio(){
    AUD.wanted = true;
    if(AUD.el && AUD.on) tryPlay();
    if(!AUD.built) buildMusic();
    if(AUD.live && AUD.live.c.state === 'suspended') AUD.live.c.resume();
  }
  document.addEventListener('pointerdown', unlockAudio, { once:false });
  function musicSpeed(level){
    if(AUD.el) AUD.el.playbackRate = Math.min(1.3, 1 + (level-1)*0.022);
  }
  function audioToggle(){
    AUD.on = !AUD.on;
    $('soundBtn').classList.toggle('off', !AUD.on);
    AUD.wanted = AUD.on;
    note(AUD.on ? 'turning on' : 'off');
    if(!AUD.built){ buildMusic(); return; }
    if(AUD.on) tryPlay(); else AUD.el.pause();
  }
  $('soundBtn').addEventListener('pointerdown', function(e){ e.stopPropagation(); audioToggle(); });
  setInterval(function(){
    var b = $('soundBtn');
    if(!b) return;
    var playing = (AUD.el && !AUD.el.paused && AUD.on) || (AUD.live && AUD.on);
    b.classList.toggle('off', !playing);
    if(playing && AUD.el && !AUD.el.paused) note('playing');
  }, 600);

  /* ---------------- loop ---------------- */
  function frame(now){
    if(!running) return;
    var dt = Math.min(0.05, (now - last)/1000 || 0);
    last = now;
    (mode === 'draw' ? DM : MM).step(dt);
    if(!running) return;
    (mode === 'draw' ? DM : MM).render();
    requestAnimationFrame(frame);
  }

  function play(m){
    mode = m; resize();
    $('modeLabel').textContent = (m === 'draw') ? 'Easy mode' : 'Master mode';
    (m === 'draw' ? DM : MM).start();
    $('score').textContent = '0';
    $('menuVeil').classList.add('hide');
    $('endVeil').classList.add('hide');
    running = true; updateBloom();
    musicPlay();
    last = performance.now();
    requestAnimationFrame(frame);
  }

  function end(cause){
    running = false;
    var s = Math.floor(G.score);
    bests[mode] = Math.max(bests[mode], s);
    $('cause').textContent = cause;
    $('final').textContent = s;
    $('best').textContent = 'Best in ' + (mode === 'draw' ? 'easy' : 'master') + '  ' + bests[mode];
    $('verdict').textContent = (mode === 'draw')
      ? (s > 2600 ? 'A long clean line.' : s > 1200 ? 'Solid. Stay low under the ceilings.' : 'Tap earlier than feels right.')
      : ('Level ' + (G.level || 1) + '. ' + (s > 9000 ? 'Ridiculous run.' : s > 4500 ? 'The gates are where the points are.' : 'Grab the paint before the gate.'));
    buildPicker(); updateBloom();
    $('endVeil').classList.remove('hide');
  }

  /* ---------------- input ---------------- */
  var py = 0, px = 0, moved = false;
  $('app').addEventListener('pointerdown', function(e){
    if(!running) return;
    py = e.clientY; px = e.clientX; moved = false;
    if(mode === 'draw') DM.tap();
  });
  $('app').addEventListener('pointermove', function(e){
    if(!running || mode !== 'master' || moved) return;
    var dx = e.clientX - px;
    if(Math.abs(dx) > 24){ MM.move(dx > 0 ? 1 : -1); moved = true; }
  });
  $('app').addEventListener('pointerup', function(e){
    if(!running || mode !== 'master' || moved) return;
    MM.move(e.clientX < W/2 ? -1 : 1);
  });
  document.addEventListener('keydown', function(e){
    if(!running) return;
    if(mode === 'draw'){
      if(e.key === ' ' || e.key === 'ArrowUp'){ e.preventDefault(); DM.tap(); }
      return;
    }
    if(e.key === 'ArrowLeft' || e.key === 'a') MM.move(-1);
    if(e.key === 'ArrowRight' || e.key === 'd') MM.move(1);
    if(e.key === ' '){ e.preventDefault(); MM.bloom(); }
  });
  $('bloomBtn').addEventListener('pointerdown', function(e){ e.stopPropagation(); if(running && mode === 'master') MM.bloom(); });
  $('pickDraw').addEventListener('pointerdown', function(e){ e.stopPropagation(); play('draw'); });
  $('pickMaster').addEventListener('pointerdown', function(e){ e.stopPropagation(); play('master'); });
  $('againBtn').addEventListener('pointerdown', function(e){ e.stopPropagation(); play(mode); });
  $('menuBtn').addEventListener('pointerdown', function(e){
    e.stopPropagation();
    $('endVeil').classList.add('hide');
    $('menuVeil').classList.remove('hide');
    $('hearts').innerHTML = ''; $('combo').textContent = ''; $('lv').textContent = '';
    $('score').textContent = '0'; $('chip').classList.add('hide');
    buildPicker(); updateBloom();
  });

  resize();
  buildPicker();
  buildMusic();
  var g0 = ctx.createLinearGradient(0,0,0,H);
  g0.addColorStop(0,'#F3ECFD'); g0.addColorStop(1,'#E4D8F6');
  ctx.fillStyle = g0; ctx.fillRect(0,0,W,H);
})();
</script>
</body>
