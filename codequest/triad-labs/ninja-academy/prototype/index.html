<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF1F5">
<title>Ninja Academy — Path of Motion</title>
<meta name="description" content="Ninja Academy: a first-person movement trial. Triad Labs, Code Quest 2026.">
<meta property="og:title" content="Ninja Academy — Path of Motion">
<meta property="og:description" content="A first-person movement trial. Triad Labs, Code Quest 2026.">
<meta property="og:image" content="https://altitudeaico.github.io/goteamolatoyes/codequest/codequest-og.jpg">
<meta property="og:type" content="website">
<style>
  html,body{margin:0;padding:0;background:#EDF1F5;overflow:hidden;height:100%}
  #root{width:100%;height:100%}
  #boot{
    position:fixed;inset:0;display:grid;place-items:center;background:#EDF1F5;
    font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.22em;
    text-transform:uppercase;color:#141922;z-index:9999
  }
  #boot.gone{display:none}
</style>
</head>
<body>
<div id="root"></div>
<div id="boot">Loading the chamber</div>
<script src="bundle.js"></script>
<script>
  (function(){
    var boot = document.getElementById('boot');
    function hide(){ boot.classList.add('gone'); }
    if (document.getElementById('root').childNodes.length) hide();
    else setTimeout(hide, 1200);
    window.addEventListener('error', function(e){
      boot.classList.remove('gone');
      boot.textContent = 'Could not start: ' + (e.message || 'unknown error');
    });
  })();
</script>
</body>
</html>
