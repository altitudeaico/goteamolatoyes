<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0912">
<title>Code Quest — the game · Elsie · Pixel Power</title>
<meta name="description" content="Learn. Code. Animate. Level up. Elsie's game concept for Code Quest 2026, presented by Pixel Power.">
<meta property="og:title" content="Code Quest — the game">
<meta property="og:description" content="Learn. Code. Animate. Level up. By Elsie, Pixel Power.">
<meta property="og:image" content="https://altitudeaico.github.io/goteamolatoyes/codequest/pixel-power/code-quest-game/slides.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{
    --void:#0B0912; --parch:#E9DFC7; --parch-dim:#9A8F7A;
    --gold:#D9A94C; --gold-hi:#F2CE7B; --phos:#45E3C4;
    --line:rgba(217,169,76,.2);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--void);color:var(--parch);min-height:100%}
  body{
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0 max(14px,env(safe-area-inset-left)) calc(40px + env(safe-area-inset-bottom))
  }
  .bar{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    max-width:1240px;margin:0 auto;padding:16px 2px 14px
  }
  .who{
    font-family:ui-monospace,monospace;font-size:10px;font-weight:700;
    letter-spacing:.24em;text-transform:uppercase;color:var(--phos)
  }
  .who b{display:block;color:var(--gold-hi);font-size:15px;letter-spacing:.06em;margin-top:5px;
         font-family:system-ui,sans-serif;font-weight:700;text-transform:none}
  .back{
    font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--parch-dim);text-decoration:none;
    border:1px solid var(--line);border-radius:3px;padding:9px 14px;white-space:nowrap
  }
  .back:hover{color:var(--gold);border-color:var(--gold)}
  .frame{
    max-width:1240px;margin:0 auto;border:1px solid var(--line);border-radius:4px;
    overflow:hidden;background:#000;line-height:0
  }
  .frame img{width:100%;height:auto;display:block;cursor:zoom-in}
  .frame img.zoom{cursor:zoom-out}
  .note{
    max-width:1240px;margin:14px auto 0;font-size:13.5px;color:var(--parch-dim);
    text-align:center;line-height:1.6
  }
  .note a{color:var(--gold-hi)}
  @media (min-width:900px){ body{padding-left:24px;padding-right:24px} }
</style>
</head>
<body>
  <div class="bar">
    <div class="who">Pixel Power &middot; Build three<b>Elsie</b></div>
    <a class="back" href="../">&larr; Pixel Power</a>
  </div>

  <div class="frame">
    <img id="slide" src="slides.jpg" alt="Code Quest game presentation board: what the game is, how to play in four steps, the three characters Elsie, Hannah and Theodore with their level-up transformations, and the skills it teaches.">
  </div>

  <p class="note">Tap the board to zoom. <a href="slides.jpg" download>Download the full image</a></p>

<script>
  var img = document.getElementById('slide');
  img.addEventListener('click', function(){
    var on = img.classList.toggle('zoom');
    img.parentElement.style.overflow = on ? 'auto' : 'hidden';
    img.style.width = on ? 'auto' : '100%';
    img.style.maxWidth = on ? 'none' : '100%';
  });
</script>
</body>
</html>
