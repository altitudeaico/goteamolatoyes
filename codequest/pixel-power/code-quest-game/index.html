<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0912">
<title>Code Quest — the game · Elsie · Pixel Power</title>
<meta name="description" content="Learn. Code. Animate. Level up. Elsie's game concept for Code Quest 2026, presented by Pixel Power.">
<meta property="og:title" content="Code Quest — the game">
<meta property="og:description" content="Learn. Code. Animate. Level up. By Elsie, Pixel Power.">
<meta property="og:image" content="https://altitudeaico.github.io/goteamolatoyes/codequest/pixel-power/code-quest-game/slides.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{
    --void:#0B0912; --parch:#E9DFC7; --parch-dim:#9A8F7A;
    --gold:#D9A94C; --gold-hi:#F2CE7B; --phos:#45E3C4;
    --line:rgba(217,169,76,.2);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--void);color:var(--parch)}
  body{
    display:flex;flex-direction:column;overflow:hidden;
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased
  }

  .bar{
    flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px max(12px,env(safe-area-inset-left)) 10px max(12px,env(safe-area-inset-right));
    border-bottom:1px solid var(--line)
  }
  .who{
    font-family:ui-monospace,monospace;font-size:9px;font-weight:700;
    letter-spacing:.22em;text-transform:uppercase;color:var(--phos);line-height:1.5
  }
  .who b{
    display:block;color:var(--gold-hi);font-size:14px;letter-spacing:0;
    font-family:system-ui,sans-serif;font-weight:700;text-transform:none
  }
  .acts{display:flex;gap:7px;flex:none}
  .acts a,.acts button{
    font-family:ui-monospace,monospace;font-size:9px;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;color:var(--parch-dim);text-decoration:none;cursor:pointer;
    border:1px solid var(--line);border-radius:3px;padding:8px 12px;background:transparent;
    white-space:nowrap
  }
  .acts a:hover,.acts button:hover{color:var(--gold-hi);border-color:var(--gold)}

  /* the slide fills whatever is left, always whole on screen */
  .stage{
    flex:1;min-height:0;display:grid;place-items:center;overflow:auto;
    padding:12px;background:
      radial-gradient(60% 50% at 50% 0%, rgba(69,227,196,.07), transparent 70%)
  }
  .stage img{
    max-width:100%;max-height:100%;width:auto;height:auto;display:block;
    border:1px solid var(--line);border-radius:3px;cursor:zoom-in;
    box-shadow:0 24px 70px rgba(0,0,0,.6)
  }
  .stage.zoomed{place-items:start center}
  .stage.zoomed img{max-width:none;max-height:none;width:1448px;cursor:zoom-out}
</style>
</head>
<body>
  <div class="bar">
    <div class="who">Pixel Power &middot; Build three<b>Code Quest &mdash; the game &middot; Elsie</b></div>
    <div class="acts">
      <button id="zoom" type="button">Zoom</button>
      <a href="slides.jpg" download>Download</a>
      <a href="../">&larr; Team</a>
    </div>
  </div>

  <div class="stage" id="stage">
    <img id="slide" src="slides.jpg" alt="Code Quest game presentation board: what the game is, how to play in four steps, the three characters Elsie, Hannah and Theodore with their level-up transformations, and the skills it teaches.">
  </div>

<script>
  var stage = document.getElementById('stage');
  var slide = document.getElementById('slide');
  var zoom  = document.getElementById('zoom');

  function toggle(){
    var on = stage.classList.toggle('zoomed');
    zoom.textContent = on ? 'Fit' : 'Zoom';
    if (!on) stage.scrollTop = stage.scrollLeft = 0;
  }
  slide.addEventListener('click', toggle);
  zoom.addEventListener('click', toggle);
  document.addEventListener('keydown', function(e){
    if (e.key === 'z' || e.key === 'Z') toggle();
  });
</script>
</body>
</html>
